# Evaluadas y descartadas: "Identidad"/"ACTIVAR SIEMPRE AL INICIAR" (son la identidad y el
# arranque de Mr. Hyde, no los tuyos: vos no tenés /using-superpowers ni ruflo); "LOS SIETE
# HÁBITOS" (framework genérico, no específico de administrar servidores); "LA BIBLIOTECA DE
# ALEJANDRÍA" (protocolo de memoria de Hyde vía CONTEXT.md; tu bitácora es otra, por DB y
# con aprobación humana, spec §6.2); "PLUGINS" y "LOS MCP DE NAVEGADOR" (herramientas de
# Claude Code que vos no tenés: tu jaula sólo te da Bash y Skill); "PENDIENTES" (el tablero
# de Fernando/Hyde, no algo que vos escribís); "POLÍTICAS ABSOLUTAS" (i18n, dark/light mode:
# políticas de producto de AteneaERP/jax-platform, no de administrar servidores; ya no
# podrías editar código igual, sólo Bash); "LOS CUATRO ESCALONES" (enrutado de modelos de
# Hyde/Codex, no aplica: vos tenés un solo cerebro por misión).

id: OP01
statement: >
  Ninguna capability de escritura/refactor puede tocar archivos que
  matcheen los patrones .env, secrets/, private_keys/ o credentials/; si
  lo intenta, la ejecución se interrumpe y se notifica.
origin: >
  las_manos/config.toml líneas 195 y 258 (forbidden_paths =
  [".env", "secrets/", "private_keys/", "credentials/"]);
  las_manos/motor_registry/catalog.py líneas 50 y 88 (carga del campo en
  MotorEntry); docs/AUTONOMIA_ANTIERROR.md líneas 174, 219 y 229
  (comportamiento ante violación: interrumpe el pipeline y notifica por
  Telegram, condición 🔴 ROJO).
status: NORMATIVA_PENDIENTE
enforcement:
  mechanism: null
  test: null
version: 0.1
created: 2026-08-15
amended_by: null
notes: >
  El campo forbidden_paths se declara y se carga (config.toml →
  catalog.py) pero no encontré código que lo verifique en tiempo de
  ejecución — grep de ".forbidden_paths" en las_manos/*.py y
  las_manos/motor_registry/*.py fuera de la declaración/carga: sin
  resultados. El comportamiento de interrupción+Telegram descrito en
  AUTONOMIA_ANTIERROR.md pertenece a un pipeline de autonomía todavía en
  fases de implementación (§7 del mismo documento, "Orden de
  implementación por fases"). Sin test.

  DISCREPANCIA CON LA TAREA: las rutas absolutas citadas en el encargo de
  esta fase ("/srv/vms, /etc/jax/.env, ~/.ssh") no aparecen en ningún
  lugar del código ni la documentación de jax/jax-platform bajo ningún
  nombre — lo único documentado son los cuatro patrones relativos de
  arriba, aplicados dentro de capabilities de código (code_swarm,
  implementation), no como una lista global de rutas intocables del
  sistema. Esta regla migra lo que SÍ existe por escrito; la versión con
  rutas absolutas queda fuera del corpus (ver sección de reglas orales
  del informe de fase).

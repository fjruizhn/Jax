id: OP02
statement: >
  Toda regla de Policy Routing en el ER7212PC (CASA-RZ) usa un IP Group
  /32 específico como Source; nunca Source=Default.
origin: >
  Confirmación directa de Fernando Ruiz, verificada por captura de pantalla
  del Omada Controller (2026-08-15): pestaña Devices → ER7212PC → Config →
  Routing → Policy Routing muestra 3 reglas activas (ASI Network,
  Multicable, Hall9000), las tres con Source = IP Group (Server_Bridge,
  Server_RichHN, Sesamo_NAS, Serveer_BlackTower, Server_Atemai,
  Server_Hall9000), ninguna con Source=Default. Segunda captura confirma
  el grupo Server_Hall9000 = IP Subnet 172.16.20.5/32.
status: NORMATIVA_PENDIENTE
enforcement:
  mechanism: null
  test: null
notes: >
  Verificado visualmente contra la config real del router — no hay
  discrepancia hoy. Un test automatizado requeriría acceso a la API del
  Omada Controller (no explorada en esta sesión) para consultar
  programáticamente las reglas y sus IP Groups; por eso
  NORMATIVA_PENDIENTE y no NORMATIVA.
version: 0.1
created: 2026-08-15
amended_by: null

id: P10
statement: >
  Ningún validador o gate puede fallar abierto ante error o ausencia de
  señal, incluyendo vía excepción sin capturar.
origin: "REFORMAS-v3.1.md Apéndice C-bis ('El patrón fail-open', nuevo en v3.1), texto verbatim de la propuesta de regla: candidata fuerte a ser la primera regla NORMATIVA del corpus, con siete casos reales de fundamento (backup-hall9000.sh, _HTTP_FACETS, output_validator.py, load_vocabulary(), IsADirectoryError sin capturar, y dos casos adicionales encontrados el 2026-08-19 durante la ejecución de R4: el try/except combinado de MemoryDB/detect_completeness_intent en jax-platform/chat.py, y logging.lastResort tragando el nivel INFO de credential_resolver sin handler propio)."
status: NORMATIVA
enforcement:
  mechanism: "policy/tests/test_no_fail_open_except.py — escaneo AST de ambos repos buscando bloques `except` cuyo cuerpo es únicamente `pass`. Un except-pass legítimo (fail-soft real, verificado uno por uno: nadie aguas abajo cree que la operación salió bien) se marca `# fail-soft: <razón específica>` en la misma línea del `except`; sin esa marca, es una violación — incluye por diseño el except-pass nuevo que alguien escriba mañana sin marcarlo."
  test: "policy/tests/test_no_fail_open_except.py"
version: 0.2
created: 2026-08-19
amended_by: null
notes: >
  Triage completo el 2026-08-19, caso por caso, con el criterio "si esto
  falla en silencio, ¿alguien más adelante actúa creyendo que salió
  bien?" (no "¿parece grave?"). De los 32 except-pass reales encontrados:
  30 fail-soft legítimos, marcados con `# fail-soft: <razón>` (limpieza
  best-effort, TOCTOU benigno en reapers, control de flujo estándar de
  asyncio/WebSocket, tests que capturan una excepción inyectada a
  propósito). 2 fail-open reales, corregidos de verdad, no marcados:

  1. jax-platform/backend/jax_engine/state.py (_poll_one_pipeline) — si
     resource_manager.release_pipeline() fallaba tras remove_pipeline(),
     el cupo concurrente quedaba leakeado para siempre y nada lo
     reintentaba (remove_pipeline ya había sacado la pipeline del
     tracking) — exactamente el bug que el comentario original de esa
     misma función documentaba haber corregido, reproducido por la
     excepción en vez de por el bug original. Corregido: try/except
     propio con logger.error(pid, tenant_id, exc_info=True) — no se
     re-lanza (tumbaría el polling de las demás pipelines del ciclo),
     pero ya no desaparece sin rastro.

  2. jax-platform/backend/api/admin/dashboard.py (_count_configured_keys)
     — `except Exception: pass` hacía indistinguible ".env no existe" de
     un error de lectura real (permisos, encoding); el dashboard de
     superadmin mostraba "0 de N configuradas" como hecho verificado en
     ambos casos. Corregido: acotado a FileNotFoundError (mismo patrón
     que chat.py/image.py/admin/keys.py, ya fail-soft legítimo), otros
     errores se propagan de verdad.

  Test corre limpio, exit 0, contra el estado real de ambos repos
  (verificado el mismo día, no en un momento anterior). El scanner sigue
  sin cubrir la forma más sutil del patrón (un fallback que retorna éxito
  por defecto sin excepción de por medio, ej. output_validator.py) — eso
  queda como residuo conocido, mismo tratamiento que Q13 (barrido de
  vocabulario) en REFORMAS-v3.1.md.

# Plantillas de renderer por predicado — REFORMAS-v3.md §3.1.6.
# Trasladadas tal cual las tres que el documento da como ejemplo. Las
# las restantes no tenían plantilla en REFORMAS-v3.md. Las plantillas
# runtime de JOB_STATUS / ENGINE_STATUS y las adiciones autorizadas
# PIPELINE_STATUS / FACET_RUNTIME_STATUS quedan definidas por F2-E-SR-001;
# STEP_STATUS queda definido por F2-E-SR2.
# Los predicados aún pendientes no pueden renderizarse.
#
# Fuente: /opt/jax/docs/REFORMAS-v3.md §3.1.6, sha256
# 4099a08c39713c79836eb1ab58fc42e0a3a1357767590cfe281c04ea7ede8660

templates:
  CAPABILITY_AVAILABLE:
    status: definida
    template: "La capability {name} está disponible en modo {mode}."

  AUDIT_EVENT_EXISTS:
    status: definida
    template: "Existe un evento de auditoría con hash {event_hash}."

  FILE_EXISTS:
    status: definida
    template: "El archivo {path} existe (hash {hash})."

  FACET_EXISTS:
    status: pendiente
    template: null

  ENGINE_STATUS:
    status: definida
    template: "La comprobación de salud registrada informa actualmente que {name} está {status}."

  CONFIG_VALUE:
    status: pendiente
    template: null

  JOB_STATUS:
    status: definida
    template: "Motor Registry registra actualmente que el job {job_id} está {status}."

  PIPELINE_STATUS:
    status: definida
    template: "Jacobs registra actualmente que el pipeline {pipeline_id} está {status}."

  STEP_STATUS:
    status: definida
    template: "Jacobs registra actualmente que el paso {step_id} está {status}."

  FACET_RUNTIME_STATUS:
    status: definida
    template: "JAX Platform actualmente marca la faceta {name} con estado de ejecución {status}."

  MEMORY_ENTRY_EXISTS:
    status: pendiente
    template: null

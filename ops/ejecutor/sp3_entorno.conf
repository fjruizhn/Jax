# ops/ejecutor/sp3_entorno.conf — SP3 del Ejecutor: la Mesa y el Ejecutor comparten la GPU. (.conf y no .env: *.env está en .gitignore para secretos; acá no hay ninguno.)
# Se AGREGA a /etc/jax/.env (producción) con respaldo previo; ver §6.3 del spec de Fase 2:
# docs/superpowers/specs/2026-09-16-ejecutor-fase2-design.md. Los números salen de la cuenta de
# §6.3 y tests/test_ejecutor_sp3_config.py la rehace: cambiar uno sin rehacerla da rojo.

# --- Modelo unificado (lo crea y lo bindea ops/ejecutor/unificar_contexto_mesa.sh) ---
# Derivado del modelo que HOY tiene jax_local (el script lo lee del binding, no de acá).
JAX_MESA_MODELO_DERIVADO=qwen3.6-mesa-131k
JAX_MESA_NUM_CTX=131072
JAX_MESA_FACETA=jax_local

# --- Proxy del Ejecutor (jax/ejecutor/proxy_carril.py; obligatorias: sin ellas NO arranca) ---
# El único modelo que la jaula puede pedir: el MISMO que la Mesa, o cada alternancia recarga.
JAX_PROXY_CARRIL_MODELO=qwen3.6-mesa-131k
# Tope de max_tokens por petición. Cuenta: §6.3 (generación a la velocidad mínima medida).
JAX_PROXY_CARRIL_MAX_SALIDA_TOKENS=1024

# --- Arnés del Ejecutor (lo consume SP2; variables de Claude Code 2.1.273, nombres verificados
#     en el binario instalado, semántica exacta NO verificada ejecutándolo) ---
# CLAUDE_CODE_AUTO_COMPACT_WINDOW: compacta al acercarse a este tamaño de contexto.
JAX_EJECUTOR_AUTO_COMPACT_WINDOW=31000
# BASH_MAX_OUTPUT_LENGTH (caracteres) y CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS: acotan cuánto
# puede crecer el contexto entre dos peticiones por UNA herramienta (el "salto" de §6.3).
JAX_EJECUTOR_BASH_MAX_OUTPUT_LENGTH=30000
JAX_EJECUTOR_FILE_READ_MAX_OUTPUT_TOKENS=8000
# Supuesto NO medido (pendiente, §6.3): caracteres por token de una salida de Bash, como mínimo.
JAX_EJECUTOR_CARACTERES_POR_TOKEN_MIN=3
# Techo de entrada que la cuenta garantiza: ventana + salto. Lo lee el test de la cuenta.
JAX_EJECUTOR_MAX_ENTRADA_TOKENS=41000

# --- Carril compartido (ops/ejecutor/instalar_carril_comun.sh) ---
# Grupo del directorio de locks. Miembros: SÓLO cuentas de servicio. NUNCA la del Ejecutor:
# con acceso a mesa.lock, la jaula podría retenerlo y dejar a la Mesa esperando para siempre.
JAX_CARRIL_GRUPO=jax-carril
JAX_CARRIL_CUENTAS=fruiz

# ============================================================
#  LAS MANOS — Configuración de capacidades y políticas
#  Sistema nervioso inhibitorio de JAX
#  
#  Diseño: Jekyll (elegancia) + Thot (contención)
#  Principio: las facetas declaran intención,
#             LAS MANOS ejecuta capacidades verificadas.
#
#  En memoria de Jairo Urbina.
# ============================================================

[server]
host = "127.0.0.1"
port = 7777
require_mtls = false          # fase 1: token simple. mTLS en fase 2.
audit_log = "/home/fruiz/jax/las_manos/logs/audit.jsonl"
kill_switch_path = "/etc/jax/PAUSE"

# ------------------------------------------------------------
#  AMBIENTES — separación estricta staging vs producción
# ------------------------------------------------------------
[environments]
staging  = ["172.16.20.11"]   # atemai-net
prod     = ["172.16.20.10"]   # server-rich-hn
bridge   = ["172.16.20.20"]   # mac mini (solo lectura durante migración)
local    = ["127.0.0.1", "172.16.20.5"]  # hall9000

# ------------------------------------------------------------
#  PERMISOS POR FACETA
#  allowed_envs: en qué ambientes puede operar
#  allowed_ops:  qué operaciones puede ejecutar
#  can_write_prod: requiere human gate adicional
# ------------------------------------------------------------
[facets.hipatia]
allowed_envs   = ["staging", "bridge", "local"]
allowed_ops    = ["ssh_exec_readonly", "read_file", "list_dir", "http_get"]
can_write_prod = false
description    = "Investigadora — solo lectura, nunca escribe"

[facets.jekyll]
allowed_envs   = ["staging", "local"]
allowed_ops    = ["ssh_exec_readonly", "read_file", "list_dir", "write_file", "validate_json", "validate_yaml"]
can_write_prod = false
description    = "Constructor — escribe en staging, nunca en prod"

[facets.thot]
allowed_envs   = ["staging", "local"]
allowed_ops    = ["ssh_exec_readonly", "read_file", "list_dir", "audit_log_read"]
can_write_prod = false
description    = "Auditor — solo lectura y consulta de logs"

[facets.ada]
allowed_envs   = ["staging", "local"]
allowed_ops    = ["ssh_exec_readonly", "read_file", "list_dir", "validate_json", "validate_yaml"]
can_write_prod = false
description    = "Analítica — lectura y validación; nunca escribe en prod"

[facets.hyde]
allowed_envs   = ["staging", "prod", "bridge", "local"]
allowed_ops    = ["ssh_exec_readonly", "ssh_exec", "read_file", "write_file", "list_dir", "rsync", "http_get", "kill_process"]
can_write_prod = true         # requiere human_gate=true en el request
description    = "Ejecutor — acceso completo con human gate en prod"

# ------------------------------------------------------------
#  OPERACIONES — definición de cada capacidad
# ------------------------------------------------------------
[ops.ssh_exec_readonly]
description  = "Ejecutar comandos de solo lectura en servidor remoto"
allow_cmds   = ["ls", "cat", "grep", "find", "df", "du", "ps", "systemctl status",
                 "sudo systemctl status", "curl", "ping", "stat", "head", "tail",
                 "wc", "echo", "hostname", "id", "whoami", "sqlite3", "mysql -e SHOW",
                 "mariadb -e SHOW", "sudo sqlite3", "sudo mariadb"]
deny_patterns = ["rm", "mv", "cp", "chmod", "chown", "dd", "mkfs", "fdisk",
                  "DROP", "DELETE", "TRUNCATE", "shutdown", "reboot", "kill"]
requires_dryrun = false

[ops.ssh_exec]
description  = "Ejecutar comandos arbitrarios en servidor remoto"
allow_cmds   = ["*"]          # allowlist abierta — Hyde es el ejecutor
deny_patterns = []            # Thot ya validó el plan antes de llegar aquí
requires_dryrun = true        # siempre dry-run primero
requires_human_gate = true    # en prod, Fernando aprueba

[ops.read_file]
description  = "Leer contenido de archivo en servidor remoto"
requires_dryrun = false

[ops.write_file]
description  = "Escribir archivo en servidor remoto"
requires_dryrun = true
requires_snapshot = true      # snapshot antes de escribir

[ops.list_dir]
description  = "Listar directorio en servidor remoto"
requires_dryrun = false

[ops.rsync]
description  = "Transferir archivos entre servidores"
requires_dryrun = true
requires_snapshot = true
requires_human_gate = true    # siempre — rsync puede destruir datos

[ops.http_get]
description  = "Realizar HTTP GET a URL externa"
requires_dryrun = false

[ops.kill_process]
description  = "Terminar proceso en servidor remoto"
requires_dryrun = true
requires_human_gate = true

[ops.audit_log_read]
description  = "Leer el log de auditoría de LAS MANOS"
requires_dryrun = false

[ops.validate_json]
description  = "Validar sintaxis JSON"
requires_dryrun = false

[ops.validate_yaml]
description  = "Validar sintaxis YAML"
requires_dryrun = false

# ------------------------------------------------------------
#  HUMAN GATE — tokens de aprobación
#  Fernando genera un token de un solo uso para aprobar
#  operaciones que requieren human_gate=true
# ------------------------------------------------------------
[human_gate]
token_ttl_seconds = 300       # 5 minutos para usar el token
token_length      = 32
gate_log          = "/home/fruiz/jax/las_manos/logs/gate.jsonl"

# ============================================================
#  MOTOR REGISTRY — motores de IA especializados
#  Cada motor es un agente externo que el Motor Registry
#  puede convocar bajo supervisión. Falla cerrado si el motor
#  no está habilitado o no existe.
#
#  En memoria de Jairo Urbina.
# ============================================================

[motors.kimi]
enabled = true
provider = "kimi"
api_key_env = "KIMI_API_KEY"
api_url = "https://api.moonshot.ai/v1/chat/completions"
model = "kimi-k2.7-code"
max_context_tokens = 256000
sandbox_only = true
default_timeout_seconds = 600
supports_reasoning = true
reasoning_default_visibility = "audit_only"

[motors.ada]
enabled = true
provider = "zai"
api_key_env = "ZAI_API_KEY"
api_url = "https://api.z.ai/api/paas/v4/chat/completions"
model = "glm-5.2"
max_context_tokens = 1000000
sandbox_only = true
default_timeout_seconds = 600
supports_reasoning = true
reasoning_default_visibility = "audit_only"

# ------------------------------------------------------------
#  CAPABILITIES — tareas que los motores pueden ejecutar
#  allowed_callers: qué facetas pueden solicitar esta tarea
#  allowed_motors: qué motores pueden ejecutarla
#  requires_human_gate: Fernando debe aprobar antes de correr
# ------------------------------------------------------------

[capabilities.code_swarm]
allowed_motors = ["kimi"]
allowed_callers = ["hyde", "ada", "kimi"]
risk_level = "high"
sandbox_only = true
requires_human_gate = true
max_execution_minutes = 30
max_recursion_depth = 1
output_schema = "code_swarm.v1"
fallback_motor = "ada"
fallback_mode = "manual_only"
forbidden_paths = [".env", "secrets/", "private_keys/", "credentials/"]

[capabilities.refactor]
allowed_motors = ["kimi"]
allowed_callers = ["hyde", "ada", "jacobs"]
risk_level = "medium"
sandbox_only = true
requires_human_gate = false
max_execution_minutes = 10
max_recursion_depth = 0
output_schema = "code_patch.v1"

[capabilities.architecture_review]
allowed_motors = ["ada"]
allowed_callers = ["hyde"]
risk_level = "medium"
sandbox_only = true
requires_human_gate = false
max_execution_minutes = 5
max_recursion_depth = 0
output_schema = "architecture_review.v1"

[capabilities.bug_hunt]
allowed_motors = ["kimi"]
allowed_callers = ["hyde", "ada"]
risk_level = "high"
sandbox_only = true
requires_human_gate = true
max_execution_minutes = 15
max_recursion_depth = 0
output_schema = "bug_hunt.v1"

[capabilities.pipeline_analysis]
allowed_motors = ["kimi"]
allowed_callers = ["jacobs", "hyde"]
risk_level = "low"
sandbox_only = true
requires_human_gate = false
max_execution_minutes = 15
max_recursion_depth = 0
output_schema = "analysis.v1"

# ------------------------------------------------------------
#  implementation — coding agéntico de largo horizonte vía Kimi.
#  Causa raíz del fallo 0.0s: Jacobs despachaba capability="implementation"
#  que no existía en este catálogo → REJECTED inmediato. Se define aquí.
#
#  Gate humano: requires_human_gate=false ES SEGURO y NO bypassa control.
#  Evidencia (verificada en código, jun-2026): el worker SOLO llama a la API
#  de Kimi y guarda el texto (worker.py) — NO ejecuta, NO escribe en remoto,
#  NO commitea. La única ruta que muta sistemas (Hyde → ssh/write) está SIEMPRE
#  gateada por /approve-step (executor.py:455). El output de Kimi solo llega a
#  una acción real a través de un step Hyde aprobado por Fernando.
# ------------------------------------------------------------
[capabilities.implementation]
allowed_motors = ["kimi"]
allowed_callers = ["jacobs", "hyde"]
risk_level = "medium"
sandbox_only = true
requires_human_gate = false
max_execution_minutes = 30
max_recursion_depth = 0
output_schema = "code_patch.v1"
forbidden_paths = [".env", "secrets/", "private_keys/", "credentials/"]

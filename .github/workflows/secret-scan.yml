name: secret-scan

# Barrera de contenido SERVER-SIDE. Existe porque los hooks de pre-commit NO
# corren en merge, rebase, cherry-pick ni revert (medido 2026-09-01), y el
# pre-push mira el ref destino y no el contenido: sin esto, un commit hecho
# con --no-verify entra a master sin que nadie revise que lleva adentro.

on:
  pull_request:
    branches: [master]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: el escaneo necesita base...head, no el ultimo commit.
          fetch-depth: 0

      - name: Escanear el diff completo del PR contra la lista de secretos conocidos
        run: |
          set -euo pipefail
          BASE=$(git merge-base origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }})
          echo "base=$BASE head=${{ github.event.pull_request.head.sha }}"
          python3 ops/ci/scan-pr-secrets.py "$BASE" "${{ github.event.pull_request.head.sha }}"

name: policy

# P10 (REFORMAS-v3.1.md, Apéndice C-bis): ningún validador/gate falla
# abierto ante error o excepción sin capturar. El enforcer mecánico
# (policy/tests/test_no_fail_open_except.py) existía desde 2026-08-19 pero
# nadie lo corría automáticamente -- ni pytest lo descubría (sin función
# test_*) ni había CI. Wireado 2026-08-20 (pago de deuda, ronda 3) tras
# encontrar 2 violaciones reales sin marcar en código de GAP2.
#
# CORREGIDO 2026-08-20 (ronda 4, T3): las rutas del scanner eran absolutas
# (/home/fruiz/jax, /home/fruiz/jax-platform) -- en este runner ninguna
# existe, así que este job era un NO-OP TOTAL desde que se wireó (ronda 3):
# "1 passed in 0.01s" en el log real, cero archivos escaneados, verde sin
# haber mirado nada. Confirmado con `gh run view --log` de las 2 corridas
# anteriores. Las rutas ahora se resuelven relativas al propio archivo del
# test -- portable a cualquier checkout, este incluido.
#
# Alcance conocido, real esta vez: este job solo escanea el árbol de este
# repo (jax). jax-platform es un repo GitHub privado separado sin checkout
# cruzado acá (necesitaría un PAT/secret nuevo -- decisión de
# infraestructura, no tomada esta sesión). jax-platform tiene su PROPIA
# copia de este scanner + workflow, escaneando solo su propio árbol --
# cobertura real por repo, sin depender de credenciales compartidas.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, edited]

# Ronda de pago de deuda 2026-08-25: `branches: [master]` dejaba a CUALQUIER
# PR de una cadena apilada (rama deuda/*-taskN con base deuda/*-taskN-1, no
# master) sin CI -- descubierto en vivo con PR jax#27 (0 runs hasta
# retargetear a master a mano). `branches: ["**"]` cubre cualquier base,
# no solo master. `types` agrega `edited` porque GitHub NO dispara
# pull_request con los tipos default (opened/synchronize/reopened) cuando
# se retarget-ea un PR existente -- sin esto, el propio retarget que
# resuelve el problema de arriba tampoco dispara una corrida sola.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-fail-open-except:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest policy/tests/test_no_fail_open_except.py -v

  no-naked-claude-subprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest policy/tests/test_claude_subprocess_solo_via_sandbox.py -v

  # El scanner de arriba (no-naked-claude-subprocess) protege que nadie
  # lance `claude` fuera de hyde_sandbox.py -- pero hasta 2026-08-25 la
  # COSA PROTEGIDA no se verificaba nunca en CI. _hyde_sandbox_test.py
  # (escrito en Task 1 del plan de gobernanza de subprocess) prueba
  # run_sandboxed_claude(), incluido un test real de dos procesos de SO
  # contra el flock(2) cross-proceso. Sin PYTHONPATH: hyde_sandbox.py y su
  # test viven los dos en el root del repo.
  hyde-sandbox-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest _hyde_sandbox_test.py -v

  # Task 6 del plan de alertas nacio con 11 tests y CERO jobs que los
  # corrieran -- tercera instancia del mismo hueco en el mes (ver la octava
  # leccion de metodo en CONTEXT.md). Este job es la correccion, y se
  # verifico rompiendo un test a proposito y confirmando que se pone ROJO:
  # que aparezca aca y salga verde no alcanza.
  #
  # Instala aiomysql y pydantic, a diferencia de los otros jobs que solo
  # necesitan pytest: los tests son de logica PURA, pero importan
  # `jacobs.facet_health`, que hace `from jacobs import store` a nivel de
  # modulo -> aiomysql, y `store` importa `jacobs.models` -> pydantic. Con
  # solo pytest el job falla en la COLECCION (ModuleNotFoundError), no en
  # un assert -- verificado en un venv limpio antes de escribir esto, no
  # supuesto. Se instalan las deps en vez de diferir el import para que el
  # job ejercite la MISMA cadena de imports que carga produccion.
  facet-health-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest aiomysql pydantic
      - run: python -m pytest jacobs/_facet_health_test.py -v

  # `check_facet_health()` es la unica pieza del lector sin cobertura
  # automatica: `evaluate_states`/`transitions_to_notify` tienen 11 tests
  # puros, pero las tres consultas, el envio, el ledger y la poda no tenian
  # ninguno -- y su `except` en el reaper es fail-soft, asi que un fallo ahi
  # se ve IGUAL que un sistema sano. Este job cierra eso.
  #
  # Necesita una MariaDB de verdad (service container), no un doble: lo que
  # se prueba ES el I/O. La base se llama jax_memory_test porque el test se
  # niega a correr contra una base cuyo nombre no termina en `_test` -- la
  # funcion bajo prueba BORRA sin filtrar por facet.
  #
  # Se verifico rompiendo el job REAL, no localmente (octava leccion).
  facet-health-io:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # httpx ademas de aiomysql/pydantic: el test parchea
      # `reaper.send_telegram_alert`, y para eso importa `jacobs.reaper`,
      # que importa httpx a nivel de modulo. Sin el, el job falla en la
      # COLECCION y no en un assert -- el mismo modo de falla que rompio
      # PR#25 en la ronda anterior.
      - run: pip install pytest aiomysql pydantic httpx
      # El guard de "no correr sin DB" es un skipif: un skip masivo se ve
      # como verde. Se exige que los 6 tests CORRAN de verdad.
      - run: python -m pytest jacobs/_facet_health_io_test.py jacobs/_store_indexes_test.py -v
      - run: |
          python -m pytest jacobs/_facet_health_io_test.py jacobs/_store_indexes_test.py \
            -q 2>&1 | tee /tmp/out
          # 6 -> 8 el 2026-09-11: _store_indexes_test.py aporta 2 (los indices
          # de las columnas por las que se filtra, y que init_tables() los cree
          # de forma idempotente). Corre aca y no en tests-puros porque necesita
          # una base VACIA: comprueba que las migraciones crean los indices en
          # un entorno nuevo, que es justo donde un ALTER a mano no llega.
          # 15 -> 8 el 2026-09-14 (PR-K ronda 4): jacobs/_direct_usage_test.py se
          #   mudo a jacobs-gobernanza-db -- en este job no existe el esquema de
          #   jax-platform (tabla `motor`), que validate_capability necesita (CI de
          #   Jax#158 rojo: 1146 "Table 'jax_memory_test.motor' doesn't exist").
          # 8 -> 9 el 2026-09-15 (Ruling T6-6): _store_indexes_test.py (+1) --
          #   idx_jacobs_pipelines_duenio (user_id, tenant_id, created_at) lo crea
          #   init_tables(); el test lo BORRA antes y lo exige de vuelta, porque la
          #   jax_memory_test local ya lo tenia y pasaba sin el cambio. Visto en rojo.
          grep -qE "^9 passed" /tmp/out || {
            echo "PISO ROTO: se esperaban 9 tests CORRIDOS (no skipeados)."; exit 1; }

  # Busqueda vectorial de la memoria contra embeddings "vector cero"
  # (2026-09-11). El 500 del chat de ese dia salio de VEC_DISTANCE_COSINE
  # contra filas de norma cero: da NaN, que `IS NULL` no atrapa, que el
  # ORDER BY ubica en cualquier lado y que aiomysql entrega como None en un
  # camino y como 0.0 en otro. Nada de eso lo reproduce un doble -- no
  # calcula distancias --, asi que el test corre contra una MariaDB real.
  # Mismo patron que facet-health-io: la base termina en _test y se exige que
  # los tests CORRAN (el guard es un skipif, y un skip masivo se ve verde).
  #
  # Verificado por mutacion antes de publicar: sin la exclusion en SQL cae
  # el test de facts (el NaN que llega como 0.0, que el filtro en Python no
  # puede ver); sin el chequeo de consulta degenerada ni el filtro de
  # distancias finitas cae el de consulta degenerada.
  memory-vector-zero-io:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # httpx: jax/memory/db.py lo importa a nivel de modulo (get_embedding).
      # cryptography: tests/test_worker_backfill.py importa jax.memory.worker,
      # que trae jax.muscles.base -> jax.core.crypto_secrets. Sin el, ese
      # archivo NO COLECTA. Medido 2026-09-11 en un venv limpio con solo este
      # pip install (no en hall9000, donde todo esta instalado): con los 4
      # paquetes, 10 tests colectados; sin cryptography, error de coleccion.
      - run: pip install pytest aiomysql httpx cryptography
      - run: >-
          PYTHONPATH=. python -m pytest -v
          tests/test_memory_vector_zero_io.py tests/test_worker_backfill.py
          tests/test_memory_scope_denormalized.py tests/test_migrar_embeddings_io.py
      # 8 contra la DB (4 de busqueda + 4 del backfill de embeddings en ceros)
      # + 2 puros del worker. Subido de 4 a 10 el 2026-09-11 (reintento de
      # embeddings en el worker): cada test nuevo se vio en rojo antes del
      # arreglo y, por mutacion, cada pieza del arreglo tiene un test que cae
      # sin ella.
      - run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_memory_vector_zero_io.py tests/test_worker_backfill.py \
            tests/test_memory_scope_denormalized.py tests/test_migrar_embeddings_io.py 2>&1 | tee /tmp/out
          # 10 -> 16 el 2026-09-11: test_memory_scope_denormalized.py agrega 6
          # (el scope copiado al mensaje, el centinela de que el scope de una
          # conversacion sigue siendo inmutable, el plan sin JOIN que si usa el
          # indice vectorial, las dos direcciones del aislamiento, y el guard
          # de mhnsw_ef_search -- con el default de MariaDB el recall@5 medido
          # fue 50,7 %, o sea media memoria perdida sin un solo error).
          # 16 -> 20 el 2026-09-12: test_migrar_embeddings_io.py (+4) -- migrar sin mover
          #   el indice, idempotencia, activar que se niega con filas en ceros, y
          #   activar/revertir (MariaDB no admite dos indices vectoriales por tabla).
          # 20 -> 23 el mismo dia, al retirar la columna vieja `embedding`:
          #   test_migrar_embeddings_io.py (+3) -- `retirar` se niega con la columna
          #   activa, se niega con la columna indexada, y borra una sin indice ni uso.
          grep -qE "^23 passed" /tmp/out || {
            echo "PISO ROTO: se esperaban 23 tests CORRIDOS (no skipeados)."; exit 1; }

  output-validator-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: PYTHONPATH=las_manos python -m pytest las_manos/_output_validator_test.py -v

  # Sello de invalidacion cross-proceso del cache de facet_resolver (Q3,
  # 2026-09-01). El job de al lado (facet-resolver-sync) verifica que los dos
  # espejos NO diverjan; este verifica que lo que hacen sea lo correcto -- son
  # dos preguntas distintas y hacen falta las dos: dos copias identicas del
  # mismo bug pasan el checker de drift en verde.
  #
  # PYTHONPATH=las_manos a proposito: `las_manos/facet_resolver.py` es un
  # symlink a `jax/core/facet_resolver.py`, asi que este job ejercita el
  # archivo real por el camino de import de Jacobs -- uno de los dos procesos
  # que hasta hoy no se enteraban de un rebind.
  #
  # aiomysql y cryptography ademas de pytest: los tests son de logica PURA
  # (parchean `_query_facet`, no tocan MariaDB), pero el modulo importa
  # aiomysql a nivel de modulo y arrastra credential_resolver -> crypto_secrets
  # -> cryptography.fernet. Con solo pytest el job falla en la COLECCION y no
  # en un assert -- verificado en un venv limpio antes de escribir esto, mismo
  # modo de falla que rompio PR#25.
  #
  # El test se auto-verifica por MUTACION: cambiando `fetched_at_wall` por
  # `fetched_at` en `_entrada_sellada` (que es el modo de falla silencioso de
  # este arreglo: comparar un mtime contra time.monotonic()) se ponen en rojo
  # los dos tests de monotonic. Verificado, no supuesto.
  # Contenimiento del sandbox de Hyde, EJERCITADO.
  #
  # POR QUE EXISTE. hyde_sandbox.py afirma propiedades de seguridad (repos en
  # solo-lectura, $HOME real no expuesto, entorno del padre no heredado) que se
  # verificaron UNA VEZ a mano al escribirlo (2026-08-23) y nunca mas.
  # `_hyde_sandbox_test.py`, el unico test que existia, cubre el flock y los
  # timeouts -- la SERIALIZACION, no el CONFINAMIENTO. Cambiar un --ro-bind por
  # un --bind no rompia ningun test: el sandbox seguia arrancando, Hyde seguia
  # funcionando, y el confinamiento se perdia en silencio.
  #
  # Los tests EJECUTAN ataques reales adentro del sandbox y, cuando el ataque es
  # una escritura, afirman SOBRE EL HOST -- un `touch` puede "fallar" y aun asi
  # haber dejado el archivo. Se auto-verifican por mutacion: cambiando
  # --ro-bind por --bind caen 3, quitando --clearenv caen 2 (verificado, no
  # supuesto).
  #
  # bubblewrap no viene en el runner. Y en Ubuntu 23.10+ AppArmor bloquea los
  # user namespaces sin privilegios, que es justamente lo que bwrap necesita:
  # se baja el sysctl, tolerando que no exista en kernels donde no aplica.
  hyde-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Instalar bubblewrap y habilitar user namespaces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "(sysctl ausente en este kernel -- no aplica)"
          bwrap --version
      - run: python -m pytest _hyde_containment_test.py -v
      # El archivo entero se auto-saltea si falta bwrap (skipif de modulo), y un
      # skip masivo se ve igual que verde. Se exige el numero real.
      - run: |
          python -m pytest _hyde_containment_test.py -q 2>&1 | tee /tmp/hyde
          grep -qE "^14 passed" /tmp/hyde || {
            echo "PISO ROTO: se esperaban 14 tests CORRIDOS (no skipeados)."; exit 1; }

  facet-resolver-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest aiomysql cryptography
      - run: PYTHONPATH=las_manos python -m pytest las_manos/_facet_resolver_seal_test.py -v
      # Los 13 tests tienen que CORRER, no saltarse: dos de ellos se saltan
      # solos si el runner corriera como root (ningun permiso bloquea a root,
      # asi que los casos de sello ilegible / no escribible no son
      # reproducibles). Un skip masivo se ve igual que verde -- este paso
      # exige el numero.
      - run: |
          PYTHONPATH=las_manos python -m pytest las_manos/_facet_resolver_seal_test.py -q 2>&1 | tee /tmp/seal
          # 12 -> 13 el 2026-09-11: el sello se estampa con `time.time()` y
          # no con `None`, y el test nuevo lo fija adelantando el reloj una
          # hora (la carrera real es de sub-milisegundo, 1/20.000 sobre xfs:
          # esperarla en un test seria un flake, no una prueba).
          grep -qE "^13 passed" /tmp/seal || {
            echo "PISO ROTO: se esperaban 13 tests CORRIDOS (no skipeados)."; exit 1; }

  # Renombrado de `facet-resolver-sync` el 2026-09-01: el checker se generalizo
  # a FAMILIAS de espejos y ahora cubre tambien credential_resolver.
  #
  # POR QUE EXISTE: el patron declarado "sin paquete compartido" replica modulos
  # a proposito entre repos, y su costo conocido es que un arreglo hecho en una
  # copia y no en la otra queda invisible. Ese costo ya se cobro TRES veces en
  # 2026 -- facet_resolver._db_conn, los cuatro sitios del default a la
  # instancia muerta 3306, y credential_resolver._db_conn -- siempre con la
  # misma forma: se cierra en un repo y sobrevive en el otro.
  #
  # credential_resolver tiene TRES archivos reales, no dos: las_manos/ tiene
  # copia propia y NO es un symlink (a diferencia de facet_resolver). Medido el
  # 2026-09-01. Esa tercera copia puede driftear DENTRO del propio repo jax, y
  # hasta hoy nadie la comparaba con nada.
  # El techo declarado en capability.max_execution_minutes es un techo de
  # verdad (2026-09-01). Antes no lo era: un timeout_seconds explicito en el
  # spec de un step pisaba el default y llegaba intacto a asyncio.wait_for --
  # la columna se podia editar en un panel admin creyendo que cambiaba algo.
  #
  # Los tests parchean get_motor_governance: prueban la POLITICA, no el I/O, y
  # no necesitan DB. Se auto-verifican por mutacion -- quitando el chequeo del
  # techo caen 9 de 14 (verificado, no supuesto).
  #
  # Deps medidas en un venv limpio, no supuestas: jacobs.plan arrastra
  # store -> aiomysql, models -> pydantic, reaper -> httpx y
  # credential_resolver -> crypto_secrets -> cryptography. Con solo pytest el
  # job falla en la COLECCION y no en un assert.
  #
  # PYTHONPATH=las_manos: es el camino de import de Jacobs (plan.py importa
  # `credential_resolver` pelado, que vive en las_manos/).
  plan-timeout-ceiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest aiomysql pydantic httpx cryptography
      - run: PYTHONPATH=las_manos python -m pytest jacobs/_plan_timeout_ceiling_test.py -v
      - run: |
          PYTHONPATH=las_manos python -m pytest jacobs/_plan_timeout_ceiling_test.py -q 2>&1 | tee /tmp/ptc
          grep -qE "^16 passed" /tmp/ptc || {
            echo "PISO ROTO: se esperaban 16 tests CORRIDOS."; exit 1; }

  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Traer el checkout de jax-platform
        run: git clone --depth=1 https://github.com/fjruizhn/jax-platform.git /tmp/jax-platform
      - name: Comparar las familias de espejos
        env:
          JAX_PLATFORM_REPO_ROOT: /tmp/jax-platform
        run: python3 scripts/check_mirror_sync.py
      # La LOGICA del comparador tiene sus propios tests, sobre fuentes
      # sinteticas. Existen porque probar el checker rompiendolo encontro un
      # defecto real: el marcador de "divergencia deliberada" no funcionaba para
      # constantes de modulo (no tienen docstring, y los comentarios no estan en
      # el AST). Una verificacion a mano que encuentra un defecto y no queda
      # escrita hay que volver a hacerla.
      - run: python -m pytest scripts/_check_mirror_sync_test.py -v
      - run: |
          python -m pytest scripts/_check_mirror_sync_test.py -q 2>&1 | tee /tmp/ms
          grep -qE "^14 passed" /tmp/ms || {
            echo "PISO ROTO: se esperaban 14 tests CORRIDOS."; exit 1; }
      # La comparacion por AST de la familia `cola_uso` contra la copia REAL de
      # jax-platform (Task 7, 2026-09-15). Corre ACA y no en tests-puros porque
      # este es el unico job con el checkout de jax-platform: alla el mismo test
      # se saltea, y un skip no compara nada. `check_mirror_sync.py` de arriba
      # ya sale con exit 2 si backend/uso/cola.py no esta -- ORDEN DE MERGE: la
      # plataforma primero.
      #
      # aiomysql: tests/test_cola_uso_escritores.py importa los dos escritores
      # reales, y los dos importan aiomysql. Con solo pytest el job fallaria en
      # la COLECCION, que es un rojo por otra razon.
      - run: pip install aiomysql
      - name: La copia de cola_uso.py es identica a la de jax-platform
        env:
          JAX_PLATFORM_REPO_ROOT: /tmp/jax-platform
          PYTHONPATH: .:las_manos
        run: python -m pytest tests/test_cola_uso_escritores.py -v
      - name: Piso exacto de tests CORRIDOS (0 skipped, con el checkout presente)
        env:
          JAX_PLATFORM_REPO_ROOT: /tmp/jax-platform
          PYTHONPATH: .:las_manos
        # 15 y no "14 + el de la comparacion": si el checkout estuviera y el
        # test se salteara igual, esto seria "14 passed, 1 skipped" y el grep
        # falla. Un control que no falla cuando la comparacion no ocurre no
        # valida la comparacion.
        #
        # Sigue en 15 el 2026-09-15 (Task 8b, el contrato pasa a TRECE campos):
        # el cambio endurece tests que ya existian y reescribe uno en su
        # contrario; no agrega ni quita archivos de test. Medido dos veces:
        # 15 passed, 0 skipped, con JAX_PLATFORM_REPO_ROOT apuntando a un
        # checkout real de jax-platform.
        run: |
          python -m pytest tests/test_cola_uso_escritores.py -q 2>&1 | tee /tmp/cu
          grep -qE "^15 passed" /tmp/cu || {

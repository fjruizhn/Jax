  # Tests de tests/ que NINGUN job corria. Medido 2026-09-11 con grep sobre
  # .github/workflows/: 18 de 26 archivos sin job. Clasificados uno por uno en
  # un venv limpio (no en hall9000) con exactamente el pip install de abajo:
  # estos 13 son puros y pasan sin DB ni red. Uno de ellos
  # (test_jacobs_timeout_by_capability.py) estaba ROTO sin que nadie lo viera:
  # pytest le colectaba cero tests y, al hacerlo test, fallo -- el refactor
  # del 2026-09-01 cambio la firma de _from_spec y el archivo nunca se
  # actualizo. Los 3 de gobernanza van en el job de abajo (necesitan DB); los
  # 3 que levantan LAS MANOS en proceso quedan anotados en DEUDA.md.
  #
  # PYTHONPATH incluye las_manos/: jacobs.plan importa credential_resolver de
  # ahi (sin eso, error de coleccion -- medido).
  tests-puros:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:las_manos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Dependencias de servicio desde requirements.txt (E-19, 2026-09-16): el
      # archivo es la fuente única; tests/test_requirements_completos.py falla si
      # un import de terceros no está fijado ahí o si este job deja de usarlo.
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # las_manos/_tool_authority_test.py::test_5c_... (BLOCK-1 de
      # ops/permisos_proyectos.py, 2026-09-25) necesita setfacl/getfacl -- sin este paso
      # el test se saltaría solo, y BLOCK-3b pedía que fuera determinista en vez de
      # depender de lo que ya venga instalado en el runner.
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y acl
      # B-1/M-4 (ronda 3, auditoría adversarial 2026-09-22): las pruebas de bwrap REAL
      # de tests/test_ejecutor_contratos_cuenta_axioma.py (pedido explícito del
      # coordinador: "un test tiene que ejecutar bwrap de verdad") se saltan solas si
      # bwrap no está -- pero un skip masivo se ve igual que verde (mismo criterio que
      # hyde-containment, más abajo, que ya resolvió este mismo problema para su propio
      # archivo). Mismos dos pasos que ese job: bubblewrap no viene en el runner, y en
      # Ubuntu 23.10+ AppArmor bloquea los user namespaces sin privilegios, que es
      # justamente lo que bwrap necesita.
      #
      # `exch` (PR #260, CI en rojo -- ronda 3 de este PR lo usaba, medido sólo en
      # hall9000, nunca contra un runner real hasta que se abrió el PR). Verificado de
      # verdad, no supuesto: el runner es `ubuntu-24.04` (`Set up job` del propio log
      # de CI); Ubuntu 24.04 (noble) trae `util-linux` 2.39.3, y `exch` recién se
      # agregó a util-linux el 2023-12-06 (commit cd094a05, upstream) -- entra en
      # util-linux 2.40, que noble NO tiene ni en el paquete base ni en
      # `util-linux-extra` (bajado y abierto el `.deb` real del archivo de Ubuntu:
      # `fadvise fincore lsfd lsirq pipesz waitpid blkpr hwclock` -- SIN `exch`). Instalar
      # `util-linux-extra` en este runner NO alcanza (primer intento, descartado tras
      # verificarlo). hall9000 SÍ lo tiene porque corre Ubuntu 26.04 (`resolute`,
      # util-linux 2.41+ vía Launchpad).
      #
      # En vez de perseguir un paquete/PPA con versiones cruzadas (riesgo real de
      # incompatibilidad de glibc contra un runner más viejo), se instala un `exch`
      # MÍNIMO -- sólo para este runner de CI, nunca para producción -- que hace
      # EXACTAMENTE lo mismo que el real: un wrapper de dos argumentos sobre
      # `renameat2(RENAME_EXCHANGE)`, vía `ctypes` contra la libc del sistema (glibc
      # expone `renameat2()` desde 2.28, muy por debajo de lo que trae cualquier Ubuntu
      # soportado) -- sin compilador, sin depender de los headers internos de
      # util-linux (`c.h`/`nls.h`, que exigirían todo su árbol de build). El script
      # real (`reemplazar_directorio_atomico.sh`) sólo le pide `command -v exch` y que
      # intercambie dos rutas atómicamente -- exactamente lo que hace este shim.
      #
      # `/etc/claude-code` (PR #260, CI en rojo -- los 4 `test_bwrap_real_*` de
      # test_ejecutor_contratos_cuenta_axioma.py, que las notas de rondas anteriores
      # daban por "pasan sueltas en el runner real" SIN haberlo comprobado nunca contra
      # un runner de verdad): el error real es `bwrap: Can't mkdir /etc/claude-code:
      # Permission denied` -- `cuenta_axioma.py::_jaula` hace `--tmpfs /etc/claude-code`
      # sobre el `/etc` REAL del host (`--dev-bind / /`), y un namespace de usuario sin
      # privilegios no puede CREAR un directorio nuevo bajo un `/etc` que no es suyo,
      # aunque root DENTRO del namespace sea el propio usuario. En hall9000 el
      # directorio YA EXISTE -- lo crea la instalación real
      # (`ops/ejecutor/instalar_contratos.sh:27`: `sudo install -d -o root -g root -m
      # 0755 /etc/claude-code`), así que bwrap sólo MONTA encima, sin mkdir. El runner
      # de CI es una máquina nueva que nunca corrió esa instalación. Se replica ACÁ el
      # mismo `install -d` que usa producción -- no una ruta inventada para CI.
      - name: Instalar bubblewrap y un exch mínimo para este runner (Ubuntu 24.04 no trae exch real)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "(sysctl ausente en este kernel -- no aplica)"
          bwrap --version
          sudo install -d -o root -g root -m 0755 /etc/claude-code
          # `/etc/ejecutor-huella` (jax#263): misma razón exacta que `/etc/claude-code` de
          # arriba. Los tests de `tests/test_ejecutor_huella_sh.py` montan su propio
          # `admin_usuario` de prueba ahí con bwrap, y un namespace sin privilegios no puede
          # CREAR el punto de montaje bajo el `/etc` del runner. En hall9000 ya existe. Se
          # replica el mismo `install -d` que hace `instalar_huella_en_maquina.sh`.
          sudo install -d -o root -g root -m 0755 /etc/ejecutor-huella
          # `/etc/ssh/authorized_keys.d` (jax#263): misma razón. En las máquinas del
          # inventario lo crea `instalar_en_maquina.sh` (C6); el runner no lo tiene y bwrap
          # no puede crear el punto de montaje bajo el `/etc` del host.
          sudo install -d -o root -g root -m 0755 /etc/ssh/authorized_keys.d
          # `~/.ssh/known_hosts` del usuario que corre (jax#263): `instalar_huella_en_maquina.sh`
          # lee el known_hosts YA CONFIADO del operador para sembrar el del servicio. En la
          # máquina del operador existe por definición; el runner es una cuenta nueva sin `~/.ssh`.
          install -d -m 0700 "$HOME/.ssh" && touch "$HOME/.ssh/known_hosts" && chmod 0600 "$HOME/.ssh/known_hosts"
          # /usr/bin, NO /usr/local/bin: test_ejecutor_reemplazar_directorio_atomico.py
          # corre el script con env={"PATH": "<bin-de-sudo-falso>:/usr/bin:/bin"} --
          # hermético a propósito, sin el PATH ambiente del runner. Es además la ruta
          # REAL donde instala util-linux-extra (`dpkg -c` del .deb real: ./usr/bin/…),
          # así que coincide con producción, no es un lugar inventado para CI.
          sudo tee /usr/bin/exch >/dev/null <<'EXCH_CI_SHIM'
          #!/usr/bin/env python3
          """exch MÍNIMO, sólo para CI (Ubuntu 24.04, sin util-linux >= 2.40): misma
          interfaz de dos argumentos que el exch real de util-linux -- intercambia dos
          rutas atómicamente vía renameat2(RENAME_EXCHANGE) por ctypes contra la libc
          del sistema. En producción (hall9000, Ubuntu 26.04) se usa el exch real de
          util-linux-extra; esto NO se instala ahí. Ver .github/workflows/policy.yml."""
          import ctypes
          import ctypes.util
          import os
          import sys

          RENAME_EXCHANGE = 1 << 1
          AT_FDCWD = -100


          def main() -> int:
              if len(sys.argv) != 3:
                  print("uso: exch ORIGEN DESTINO", file=sys.stderr)
                  return 1
              libc = ctypes.CDLL(ctypes.util.find_library("c"), use_errno=True)
              origen, destino = sys.argv[1].encode(), sys.argv[2].encode()
              rc = libc.renameat2(AT_FDCWD, origen, AT_FDCWD, destino, RENAME_EXCHANGE)
              if rc != 0:
                  err = ctypes.get_errno()
                  print(f"exch: {os.strerror(err)}", file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          EXCH_CI_SHIM
          sudo chmod 0755 /usr/bin/exch
          command -v exch || { echo "exch shim no quedó instalado -- revisar el heredoc de arriba"; exit 1; }
          # Prueba real, no sólo "está en el PATH": intercambia dos archivos de mentira
          # y confirma que el contenido de verdad se intercambió.
          tmp="$(mktemp -d)"
          echo AAA > "$tmp/a"; echo BBB > "$tmp/b"
          exch "$tmp/a" "$tmp/b"
          [ "$(cat "$tmp/a")" = "BBB" ] && [ "$(cat "$tmp/b")" = "AAA" ] || \
            { echo "el exch shim no intercambió de verdad -- ver /tmp de la prueba"; exit 1; }
          rm -rf "$tmp"
          # Prueba con el PATH HERMÉTICO real que usa el test -- no sólo el PATH del
          # runner. jax#260 CI, ronda 2 de fixes: instalado en /usr/local/bin la vez
          # anterior, y el test lo perdía porque restringe el PATH a
          # "<bin-de-sudo-falso>:/usr/bin:/bin", sin /usr/local/bin -- este chequeo
          # habría atrapado eso antes de empujar.
          env -i PATH=/usr/bin:/bin bash -c 'command -v exch' || \
            { echo "exch no aparece con PATH=/usr/bin:/bin -- el mismo PATH hermético que usa test_ejecutor_reemplazar_directorio_atomico.py::_correr"; exit 1; }
      - run: >-
          python -m pytest -v --junitxml=/tmp/tests-puros-first.xml
          tests/test_las_voces_sync.py
          tests/test_las_voces_ariadna_authority.py
          tests/test_las_voces_ariadna_runtime.py
          tests/test_las_voces_ariadna_activation.py
          tests/test_las_voces_ariadna_host.py
          tests/test_las_voces_ariadna_planner.py
          tests/test_las_voces_ariadna_dispatcher.py
          tests/test_las_voces_jaxqwen.py
          tests/test_las_voces_jaxqwen_trust.py
          tests/test_las_voces_jaxqwen_transport.py
          tests/test_las_voces_jaxqwen_host.py
          tests/test_las_voces_jaxqwen_git_trust.py
          tests/test_ejecutor_proxy_jaxqwen_uds.py
          tests/test_capability_unbound_schema.py tests/test_chunking.py
          tests/test_completeness_intent.py tests/test_dispatch_step_reroute.py
          tests/test_vocativo_faceta.py tests/test_router_easter_egg.py
          tests/test_probar_c5_pasa_todas_las_compuertas.py
          tests/test_docker_rm_sin_fuga_de_volumenes.py
          tests/test_identity_context.py tests/test_jacobs_director.py
          tests/test_memory_correction.py tests/test_memory_helpers.py
          tests/test_read_audit_log_unbound.py tests/test_template_hash.py
          tests/test_f2e_runtime_status.py
          tests/test_validate_capability_typed.py
          tests/test_project_authority_input_validation.py
          tests/test_jacobs_timeout_by_capability.py tests/test_memory_schema_drift.py
          tests/test_no_blocking_in_async.py tests/test_load_test_harness.py
          tests/test_hnsw_recall_tripwire.py

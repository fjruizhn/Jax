          tests/test_jacobs_descarte_db.py
          tests/test_base_por_sesion.py::test_copiar_filas_excluye_columnas_generadas_y_no_revienta_con_1906
          tests/test_base_por_sesion.py::test_columnas_copiables_excluye_solo_las_generadas
      - name: Piso exacto de tests CORRIDOS
        # Medido 2026-09-11 (venv limpio, esquema de las migraciones): 14 passed.

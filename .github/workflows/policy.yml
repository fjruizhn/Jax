name: policy

# P10 (REFORMAS-v3.1.md, Apéndice C-bis): ningún validador/gate falla
# abierto ante error o excepción sin capturar. El enforcer mecánico
# (policy/tests/test_no_fail_open_except.py) existía desde 2026-08-19 pero
# nadie lo corría automáticamente -- ni pytest lo descubría (sin función
# test_*) ni había CI. Wireado 2026-08-20 (pago de deuda, ronda 3) tras
# encontrar 2 violaciones reales sin marcar en código de GAP2.
#
# CORREGIDO 2026-08-20 (ronda 4, T3): las rutas del scanner eran absolutas
# (/home/fruiz/jax, /home/fruiz/jax-platform) -- en este runner ninguna
# existe, así que este job era un NO-OP TOTAL desde que se wireó (ronda 3):
# "1 passed in 0.01s" en el log real, cero archivos escaneados, verde sin
# haber mirado nada. Confirmado con `gh run view --log` de las 2 corridas
# anteriores. Las rutas ahora se resuelven relativas al propio archivo del
# test -- portable a cualquier checkout, este incluido.
#
# Alcance conocido, real esta vez: este job solo escanea el árbol de este
# repo (jax). jax-platform es un repo GitHub privado separado sin checkout
# cruzado acá (necesitaría un PAT/secret nuevo -- decisión de
# infraestructura, no tomada esta sesión). jax-platform tiene su PROPIA
# copia de este scanner + workflow, escaneando solo su propio árbol --
# cobertura real por repo, sin depender de credenciales compartidas.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, edited]

# Ronda de pago de deuda 2026-08-25: `branches: [master]` dejaba a CUALQUIER
# PR de una cadena apilada (rama deuda/*-taskN con base deuda/*-taskN-1, no
# master) sin CI -- descubierto en vivo con PR jax#27 (0 runs hasta
# retargetear a master a mano). `branches: ["**"]` cubre cualquier base,
# no solo master. `types` agrega `edited` porque GitHub NO dispara
# pull_request con los tipos default (opened/synchronize/reopened) cuando
# se retarget-ea un PR existente -- sin esto, el propio retarget que
# resuelve el problema de arriba tampoco dispara una corrida sola.

# B9 migrations used by ephemeral schema bootstraps belong to this checkout.
env:
  JAX_REPO_PATH: ${{ github.workspace }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  las-voces-faro-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml mcp==2.2.0
      - name: Paquete Faro permanente y frontera MCP read-only
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_las_voces_faro_readonly.py \
            tests/test_las_voces_faro_mcp_client.py \
            tests/test_las_voces_faro_paquete.py \
            tests/test_las_voces_qwen_auto.py 2>&1 | tee /tmp/las-voces-faro-readonly
          python3 .github/ci/piso.py verificar las-voces-faro-readonly/las-voces-faro-readonly /tmp/las-voces-faro-readonly || exit $?

  memory-b9-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: jax_memory_test_memb9_ci
          MARIADB_USER: jax_test
          MARIADB_PASSWORD: ci-test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # Second, empty container for tests/memory_b9_regression_driver.py. The driver needs a
      # FRESH provisioned database (real tables, migrations 001-013) and the pytest step
      # above leaves real tables behind, so they cannot share a database. jax_test only
      # has grants on its own database here too.
      mariadb-driver:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: jax_memory_test_memb9_driver
          MARIADB_USER: jax_test
          MARIADB_PASSWORD: ci-test
        ports: ["3307:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      PYTHONPATH: .
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: jax_test
      JAX_DB_PASSWORD: ci-test
      JAX_DB_NAME: jax_memory_test_memb9_ci
      JAX_TEST_DB_SUFIJO: memb9_ci
      LAS_MANOS_URL: http://las-manos.invalid:7777
      JAX_OLLAMA_URL: http://ollama.invalid:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same interpreter as the measured isolated nine-module suite.
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Regresiones B9 con MariaDB efímera y usuario limitado
        # runner.temp is available in step env, not job env.
        env:
          JAX_USAGE_SPOOL_DIR: ${{ runner.temp }}/memory-b9/usage
          JAX_REPO_BASE: ${{ runner.temp }}/memory-b9/repo
          JAX_AUDIT_LOG_PATH: ${{ runner.temp }}/memory-b9/audit.jsonl
          JAX_FACET_SEAL_PATH: ${{ runner.temp }}/memory-b9/facet-seal.json
          JAX_KILL_SWITCH_PATH: ${{ runner.temp }}/memory-b9/PAUSE
        # This container starts empty. Each DB test creates its own temporary
        # tables; jax_test has grants only on this job's suffixed test DB, never production.
        # The root conftest's governance bootstrap reads host configuration;
        # this explicit boundary does not load it or migrate any shared schema.
        # Measured 2026-09-26 against MariaDB 12.3.3: 102 passed, no skips/errors.
        # Re-measured 2026-10-05 (fix/memoria-worker-cuarentena-aviso-orden, local disposable DB):
        # 176 passed, 0 skipped (121 before the branch). Floor in ci/pisos.json; the runner has the last word.
        # Exact PR run 37317897149, job 111789176129, SHA daab357ce80b1e7e1843155b88e2f57c9adf93bd:
        # 183 passed, 0 failed, 0 errors, 0 skipped; this merged Faro/B9 count is the current floor.
        run: |
          set -euo pipefail
          python -m pytest --confcutdir=tests \
            tests/test_faro_memoria_db.py \
            tests/test_memory_readonly_connect.py \
            tests/test_memory_extraction_jobs.py \
            tests/test_b9_persistent_api.py \
            tests/test_b9_embedding_mapping_e2e.py \
            tests/test_b9_mariadb_adapter.py \
            tests/test_memory_aux_regressions.py \
            tests/test_b9_worker_composition.py \
            tests/test_worker_backfill.py \
            tests/test_url_proveedor_workers_memoria.py \
            tests/test_legacy_adoption.py \
            tests/test_memory_b9_provision.py \
            -q --junitxml="$RUNNER_TEMP/memory-b9.xml"
          MINIMO_CASOS=$(python3 .github/ci/piso.py minimo memory-b9-regression/casos) || exit $?
          export MINIMO_CASOS
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          cases = list(ET.parse(Path(os.environ['RUNNER_TEMP']) / 'memory-b9.xml').iter('testcase'))
          incomplete = [case for case in cases if any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped'))]
          minimo = int(os.environ['MINIMO_CASOS'])
          if len(cases) < minimo or incomplete:
              raise SystemExit(f'B9 regression incomplete: {len(cases)} cases, {len(incomplete)} failed/error/skipped; minimum {minimo}, none skipped')
          print(f'B9 regression: {len(cases)} passed, 0 failed, 0 errors, 0 skipped')
          PY
      - name: Driver de regresion B9 sobre una base fresca (fixtures + 19 casos)
        # tests/memory_b9_provision.py builds jax_memory_test_memb9_driver (schema +
        # migrations 001-013 + jax_tenants/jax_users rows) and refuses a non-empty
        # database; the driver then exits non-zero if any case fails, and prints
        # status PASS only with every case green. Local run 2026-10-05: 19 PASS.
        env:
          JAX_DB_PORT: "3307"
          JAX_DB_NAME: jax_memory_test_memb9_driver
          JAX_TEST_DB_SUFIJO: memb9_driver
        run: |
          set -euo pipefail
          python tests/memory_b9_provision.py
          python tests/memory_b9_regression_driver.py | tee "$RUNNER_TEMP/b9-driver.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = json.loads(Path(os.environ['RUNNER_TEMP'], 'b9-driver.json').read_text().splitlines()[-1])
          bad = [name for name, case in out.get('cases', {}).items() if case.get('status') != 'PASS']
          if out.get('status') != 'PASS' or bad or len(out.get('cases', {})) < 19:
              raise SystemExit(f"B9 driver incomplete: status={out.get('status')} cases={len(out.get('cases', {}))} bad={bad}")
          print(f"B9 driver: {len(out['cases'])} cases PASS")
          PY

  governed-execution-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          # Root conftest deliberately pins all write-capable tests to this
          # test-only name; isolation comes from this job's fresh container.
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_EXECUTION_TEST_MARIADB: "1"
      # jax#266: este job levanta su propio contenedor, que muere con el job --
      # es el único lugar donde está bien que un test DROPee `jax_evidence`
      # para pararse en un esquema virgen. Sin esta variable el test falla
      # (no se saltea): es la única prueba contra base real de que la siembra
      # siembra, y saltearla en silencio sería el verde sin trabajo de siempre.
      JAX_EVIDENCE_TEST_DESTRUCTIVE: "1"
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Canonicalization is pinned to Unicode 16, supplied by Python 3.14.
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/policy/test_execution_mariadb_integration.py -v

  enforcement-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest
      # jax#260: el generador de scripts/generar_manifiesto_identidad.py, sin
      # el cual LAS MANOS no arranca desde master (FileNotFoundError en
      # /etc/jax/build/implementation-identity.json). Paso propio, separado
      # del siguiente: no lleva --junitxml, así que no puede tocar el
      # _TEST_CONTROL_MAP que el paso "Emitir manifiesto B7 controlado" exige
      # completo más abajo.
      - name: Generador de identidad de implementación (jax#260)
        run: PYTHONPATH=. python -m pytest tests/policy/test_generar_manifiesto_identidad.py -v
      # jax#266: la siembra de `control_definitions`, sin la cual el paso 9 del
      # runbook de identidad (jaxctl con verdict SUPPORTED) es inalcanzable en
      # cualquier despliegue nuevo -- la tabla queda vacía y toda consulta de
      # estado sale UNAVAILABLE. Paso propio, por el mismo motivo que el de
      # arriba: sin --junitxml, así no toca el _TEST_CONTROL_MAP que el paso
      # "Emitir manifiesto B7 controlado" exige completo. La parte que necesita
      # una MariaDB real corre en el job governed-execution-mariadb
      # (test_sembrar_definiciones_de_control_es_idempotente).
      - name: Siembra de definiciones de control (jax#266)
        run: PYTHONPATH=. python -m pytest tests/policy/test_sembrar_definiciones_de_control.py -v
      # Do not run these from tests-puros: pytest then places tests/policy
      # ahead of the production policy package on sys.path.
      - name: Ejecutar controles B7 y capturar salida
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest tests/policy/test_enforcement_evidence_core.py tests/policy/test_enforcement_evidence_mariadb_api.py tests/policy/test_worker_result_execution_binding.py -q --junitxml=/tmp/b7.xml 2>&1 | tee /tmp/b7-out
      - name: Emitir manifiesto B7 controlado
        run: |
          python - <<'PY'
          import hashlib, json, os, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          raw=open('/tmp/b7-out','rb').read(); now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          from policy.enforcement_evidence.test_evidence import _TEST_CONTROL_MAP
          tests=[]
          for case in ET.parse('/tmp/b7.xml').iter('testcase'):
            test_id=case.attrib['classname'].replace('.', '/')+'.py::'+case.attrib['name']
            if test_id not in _TEST_CONTROL_MAP:
              raise SystemExit('unmapped B7 JUnit node: '+test_id)
            result='ERROR' if case.find('error') is not None else 'FAILED' if case.find('failure') is not None else 'SKIPPED' if case.find('skipped') is not None else 'PASSED'
            tests.append({'test_id':test_id,'bindings':[{'control_id':control_id,'control_version':1} for control_id in _TEST_CONTROL_MAP[test_id]],'result':result})
          if {x['test_id'] for x in tests} != set(_TEST_CONTROL_MAP) or len(tests) != len({x['test_id'] for x in tests}):
            raise SystemExit('JUnit B7 node coverage incomplete')
          counts={key:sum(x['result']==name for x in tests) for key,name in [('passed','PASSED'),('failed','FAILED'),('error','ERROR'),('skipped','SKIPPED')]}; counts['total']=len(tests)
          m={'schema_version':'1.0','kind':'JAX_TEST_EVIDENCE_MANIFEST','provider':'github-actions','repository_id':os.environ['GITHUB_REPOSITORY'],'commit_sha':os.environ['GITHUB_SHA'],'implementation_identity_hash':'sha256:'+hashlib.sha256(os.environ['GITHUB_SHA'].encode()).hexdigest(),'workflow':'policy.yml','run_id':os.environ['GITHUB_JOB'],'job_id':os.environ['GITHUB_JOB'],'environment':'CI','started_at_utc':now,'completed_at_utc':now,'tests':tests,'counts':counts,'raw_output_blob_hash':'sha256:'+hashlib.sha256(raw).hexdigest()}
          open('b7-controlled-test-manifest.json','w').write(json.dumps(m,sort_keys=True,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b7-controlled-test-manifest
          path: b7-controlled-test-manifest.json

  no-fail-open-except:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest policy/tests/test_no_fail_open_except.py -v
      - run: python -m pytest policy/tests/test_stderr_no_se_tira.py -v
      - run: python -m pytest policy/tests/test_reglas_citan_archivos_que_existen.py -v
      # CORPUS.md es GENERADO de policy/rules/*.yaml. El 2026-09-23 se encontró desfasado:
      # un párrafo de una regla (cierre parcial del 2026-08-25) nunca había llegado al corpus,
      # y nada lo notaba. Regenerar y exigir que no cambie nada.
      - name: CORPUS.md coincide con policy/rules
        run: |
          python policy/tools/generate_corpus.py
          git diff --exit-code -- policy/generated/CORPUS.md || { echo "CORPUS.md desfasado: correr policy/tools/generate_corpus.py y commitear"; exit 1; }
      # Detector agregado 2026-09-20: un `run:` que no es bash valido mata el
      # job ANTES de que llegue a comprobar lo suyo, asi que el piso nunca se
      # compara y el hueco queda tapado por el verde del resto de la matriz.
      # Paso el mismo dia resolviendo un conflicto en el piso de tests-puros:
      # `yaml.safe_load` daba OK con el bash roto adentro -- parsear no es
      # validar. El detector se ejercita a si mismo con el bloque que fallo.
      - run: python -m pytest policy/tests/test_workflows_bash_valido.py -v
      # Detector agregado 2026-09-18 (ronda de arreglo del auditor local, hallazgo
      # CRÍTICO de la revisión): scripts/ejecutor_contratos/mision_de_humo.py validaba
      # el arranque contra la máquina de la misión (auditor local incluido) y auditaba
      # la entrega real con la faceta de NUBE, resuelta por su cuenta -- mismo criterio
      # de detector mecánico que P10, sin dependencias nuevas.
      - run: python -m pytest policy/tests/test_auditor_c5_punto_unico.py -v

  # Job propio, chico, sin dependencias pesadas (mismo criterio que no-fail-open-except):
  # la garantía de "cero GPU" del auditor local (2026-09-18, hallazgo ALTO de la revisión)
  # vive en ops/ejecutor/ollama-cpu.env.plantilla, no sólo en /etc/jax/ollama-cpu.env --
  # este job audita que las cuatro variables sigan escritas y vacías, y que el instalador
  # exija lo que hace falta y corra el canario. El canario en sí (una generación real
  # contra Ollama) no corre acá -- este runner no tiene la GPU ni el Ollama de hall9000;
  # se verificó a mano contra el proceso real (rojo con la config rota, verde restaurada,
  # ver ops/ejecutor/canario_ollama_cpu.sh y la Biblioteca de esta ronda).
  auditor-local-gpu-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/test_ejecutor_ollama_cpu_gpu_off.py -v

  # Detector de archivos de test sin job de CI (historial-y-arreglos-de-pipeline,
  # 2026-09-18). El hallazgo que lo motiva: de 6 archivos de test creados en
  # esta ronda, 5 no corrían en ningún job -- y las_manos/_tool_authority_test.py
  # (el jail de rutas del Ejecutor) llevaba MESES sin correr en CI porque nadie
  # se acordó de agregarlo a la lista de policy.yml. Este job no reemplaza esa
  # lista por otra lista: lee policy.yml con PyYAML y falla si encuentra un
  # archivo de test (tests/, jacobs/_*_test.py, las_manos/_*_test.py y
  # cualquier otro test_*.py/_*_test.py del árbol) que ningún `run:` de ningún
  # job invoque, salvo que esté declarado en EXCEPCIONES con motivo escrito.
  # Job propio, sin dependencias pesadas: solo pytest + pyyaml.
  archivos-de-test-en-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest policy/tests/test_archivos_de_test_wireados_en_ci.py -v
      - name: Piso exacto de tests CORRIDOS
        # Medido 2026-09-18 en venv limpio: 7 passed.
        run: |
          python -m pytest -q policy/tests/test_archivos_de_test_wireados_en_ci.py 2>&1 | tee /tmp/wireados
          python3 .github/ci/piso.py verificar archivos-de-test-en-ci/wireados /tmp/wireados || exit $?
      - name: Piso exacto de tests CORRIDOS de los pisos fuera del workflow
        run: |
          python -m pytest -q policy/tests/test_pisos_fuera_del_workflow.py policy/tests/test_pisos_migracion_desde_master.py policy/tests/test_comparar_pisos.py 2>&1 | tee /tmp/pisos
          python3 .github/ci/piso.py verificar archivos-de-test-en-ci/pisos /tmp/pisos || exit $?

  # Los pisos viven en ci/pisos.json (fuera de la reserva de .github/**): este job impide que un
  # PR baje uno. JOB AISLADO a proposito: no instala ni ejecuta nada del PR (ni pytest, ni pip, ni
  # nada que importe el repo), porque un conftest.py o un sitecustomize del PR podrian reescribir
  # .git/config o las refs y falsear la base. La base viene de la URL fija del repositorio a una
  # ref propia, sin depender del remote configurado. Ver docs/ci/pisos.md.
  pisos-no-bajan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Traer la base desde la URL fija del repositorio
        run: |
          git fetch --no-tags --depth=1 "${{ github.server_url }}/${{ github.repository }}" +refs/heads/master:refs/pisos-base/master || exit $?
      - name: Los pisos no bajan respecto de la punta de master
        run: |
          python3 -I .github/ci/comparar_pisos.py refs/pisos-base/master || exit $?

  ci-usa-la-mariadb-de-produccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sin dependencias: lee los YAML de este mismo repo. Sale != 0 si algun
      # workflow levanta una MariaDB distinta a la de produccion.
      - run: python3 policy/tests/test_ci_usa_la_mariadb_de_produccion.py

  no-naked-claude-subprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest policy/tests/test_claude_subprocess_solo_via_sandbox.py policy/tests/test_titular_solo_via_exigir_titular.py policy/tests/test_ejecutor_lanza_solo_con_contratos.py policy/tests/test_run_cli_solo_con_preparar_arranque.py -v
      - name: Piso exacto del scanner de subprocesos de CLIs de suscripcion
        # 51 tests (28 + 9 autopruebas de las formas nuevas, auditoria 2026-10-02,
        # MINOR-6/MINOR-7, + 8 de las formas dinamicas de la ronda 2, MINOR-16, + 4 de la
        # reauditoria, MINOR-28: la mencion partida y la exencion explicita de axioma_sync.py,
        # + 2 de MAJOR-30, auditoria del SHA 174da8c: la exencion exige el conjunto exacto de
        # cadenas con "claude" y el archivo real lo cumple), + 3 de LV-001
        # (exenciones Faro por ruta/fuente exacta, y sin argv libre nuevo),
        # medidos con JAX_PLATFORM_REPO_ROOT apuntando a un
        # directorio que no existe: en el runner jax-platform tampoco existe y el
        # escaneo real cubre solo este repo. Exacto: una autoprueba que desaparezca
        # deja pasar en silencio la forma que cubria.
        run: |
          python -m pytest -q policy/tests/test_claude_subprocess_solo_via_sandbox.py 2>&1 | tee /tmp/scanner
          python3 .github/ci/piso.py verificar no-naked-claude-subprocess/scanner /tmp/scanner || exit $?
      - name: Piso exacto del control "un Titular solo nace en exigir_titular"
        # 9 tests (MINOR-16, ronda 2): 7 autopruebas del detector + el escaneo que ve el
        # arbol y el real. Medido con JAX_PLATFORM_REPO_ROOT=/nonexistent. Exacto: una
        # autoprueba que desaparezca deja pasar en silencio la forma que cubria.
        run: |
          python -m pytest -q policy/tests/test_titular_solo_via_exigir_titular.py 2>&1 | tee /tmp/titular
          python3 .github/ci/piso.py verificar no-naked-claude-subprocess/titular /tmp/titular || exit $?
      - name: Piso exacto del control "quien llama a run_cli cablea preparar_arranque"
        # 7 tests (MINOR-35, auditoria del SHA 174da8c): el escaneo del arbol real (hoy sin
        # llamadores, pasa vacio a proposito) + 6 autopruebas sobre snippets. Medido con
        # JAX_PLATFORM_REPO_ROOT=/nonexistent. Exacto: una autoprueba que desaparezca deja
        # pasar un llamador sin arranque cuando los pasos 6 y 9 lo agreguen.
        run: |
          python -m pytest -q policy/tests/test_run_cli_solo_con_preparar_arranque.py 2>&1 | tee /tmp/arranque
          python3 .github/ci/piso.py verificar no-naked-claude-subprocess/arranque /tmp/arranque || exit $?
      - name: Piso exacto de la guardia del arranque del Ejecutor
        # 5 tests (Ejecutor SP1 plan 6, 2026-09-17): nadie usa remoto_claude ni vigilar sin
        # exigir_contratos. Exacto: uno que desaparezca deja pasar un lanzador sin contratos.
        run: |
          python -m pytest -q policy/tests/test_ejecutor_lanza_solo_con_contratos.py 2>&1 | tee /tmp/lanza
          python3 .github/ci/piso.py verificar no-naked-claude-subprocess/lanza /tmp/lanza || exit $?

  # El scanner de arriba (no-naked-claude-subprocess) protege que nadie
  # lance `claude` fuera de hyde_sandbox.py -- pero hasta 2026-08-25 la
  # COSA PROTEGIDA no se verificaba nunca en CI. _hyde_sandbox_test.py
  # (escrito en Task 1 del plan de gobernanza de subprocess) prueba
  # run_sandboxed_claude(), incluido un test real de dos procesos de SO
  # contra el flock(2) cross-proceso. Sin PYTHONPATH: hyde_sandbox.py y su
  # test viven los dos en el root del repo.
  hyde-sandbox-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest _hyde_sandbox_test.py -v
      # Piso exacto (MINOR-34, auditoria del SHA 174da8c): 11 tests, medido 2026-10-02 con Python
      # 3.12. Sin esto, borrar `LlamadaAlLockCompartidoTest` (la que prueba que
      # run_sandboxed_claude toma el lock compartido) dejaba el job en verde.
      - run: |
          python -m pytest _hyde_sandbox_test.py -q 2>&1 | tee /tmp/hydesb
          python3 .github/ci/piso.py verificar hyde-sandbox-unit/hydesb /tmp/hydesb || exit $?
      # Golden de wrap_hyde_command (D-4, facetas-por-suscripcion, 2026-10-01):
      # el argv y el env de Hyde congelados ANTES de que pase al nucleo comun
      # cli_sandbox. Piso exacto: 3 tests (coincide con la golden, la fixture no
      # cambio, cubre los tres escenarios). Medido 2026-10-01: 3 passed.
      - run: python -m pytest _hyde_wrap_golden_test.py -v
      - run: |
          python -m pytest _hyde_wrap_golden_test.py -q 2>&1 | tee /tmp/golden
          python3 .github/ci/piso.py verificar hyde-sandbox-unit/golden /tmp/golden || exit $?

  # cli_sandbox: nucleo comun del confinamiento de CLIs de suscripcion
  # (facetas-por-suscripcion, 2026-10-01, paso 1). El archivo mezcla logica pura
  # con CONTENCION REAL (ataques dentro de bwrap): sin bwrap la clase se
  # auto-saltea y un skip se ve igual que verde, asi que se instala bwrap y se
  # exige el numero exacto de tests CORRIDOS y cero skips. Medido 2026-10-01 en
  # hall9000: 65 passed. 2026-10-02 (auditoria del paso 1-3,
  # MAJOR-1..5 y MINOR-8/9/10/13): 134 passed. 2026-10-02 (ronda 2: MAJOR-14/15 y
  # MINOR-16..21, topes de timeout por entry_point, features automaticas): 206 passed.
  # 2026-10-02 (reauditoria del SHA 9a5d618, MINOR-22..29 y el tope de `canary`): 239 passed.
  # 2026-10-02 (auditoria del SHA 174da8c, MINOR-31/32/33/36: el log cubre los 8 campos, el
  # `clave=valor` falso, el timeout de `features list` transitorio y el hint de EACCES): 251 passed.
  cli-sandbox-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Instalar bubblewrap y habilitar user namespaces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "(sysctl ausente en este kernel -- no aplica)"
          bwrap --version
      - run: python -m pytest _cli_sandbox_test.py -v
      - run: |
          python -m pytest _cli_sandbox_test.py -q 2>&1 | tee /tmp/clisb
          python3 .github/ci/piso.py verificar cli-sandbox-unit/clisb /tmp/clisb || exit $?
          if grep -qE "skipped" /tmp/clisb; then
            echo "HAY TESTS SALTADOS: la contencion real no se ejercito."; exit 1; fi

  # El Faro, fase 0 (spec 2026-10-02-faro-pasarela-ecosistema-design.md, plan
  # 2026-10-02-faro-fase-0.md, pasos 0.1 y 0.2 y la ronda de auditoria): el paquete fijado del
  # ecosistema y el Puerto MCP de solo lectura. Las pruebas levantan un Puerto REAL en un socket
  # Unix temporal y le hablan con un cliente MCP real del SDK oficial por el rele stdio (un
  # subproceso `python -m jax.faro.relay`), y construyen paquetes reales desde un repo git efimero.
  # TODO sale con HASH: mcp de requirements-faro.txt, pytest y el cliente de base de
  # requirements-faro-ci.txt (`--require-hashes`, sin `pip install` suelto: lo vigila
  # tests/test_faro_requirements.py). Piso exacto de tests CORRIDOS, cero saltados (un skip se ve igual
  # que verde). Medido 2026-10-05 en hall9000 con Python 3.14: 688 passed; re-medido el
  # 2026-10-06 (jax#370 r3): 720 passed — el catalogo cerrado de topes (decision de Fernando,
  # R-4) agrego 32 pruebas de runtime, y las de mecanica pasaron a recursos del catalogo.
  # Re-medido ronda 5 (B-3): 721 — el catalogo llega del pin por parametro y sin el no se
  # topea nada (+1). Sin skips. La CI usa Python 3.12 y confirma el mismo piso.
  # Re-medido ronda 6 (D-4 piso de codigo + catalogo sellado): 722 — el runtime solo
  # acepta el CatalogoTopes sellado del snapshot, nunca un Mapping cualquiera (+1).
  # Re-medido ronda 7 (solo el snapshot emite; catalogo de pin de prueba): 726 —
  # recursos de clase prohibida con subid ajeno (AUD2 x3) y catalogo de bytes
  # sueltos niegan (+4).
  # (paquete 82 + puerto 87 + e2e 9 + transporte 37 + cadena 21 + requirements 7 + aviso 68 + topes 109 +
  # control 170 + lanzador 77 + acl 43 + memoria 15; desde aviso, los pasos 0.3b y 0.3c y su auditoria). Las pruebas con bwrap y uids
  # reales estan en el job `faro-jaula`; las de la base real, en `faro-bitacora-db`.
  faro-fase0:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-faro.txt
      - run: pip install --require-hashes -r requirements-faro-ci.txt
      - run: python -m pytest tests/test_faro_paquete.py tests/test_faro_puerto.py tests/test_faro_puerto_e2e.py tests/test_faro_transporte.py tests/test_faro_cadena.py tests/test_faro_requirements.py tests/test_faro_aviso.py tests/test_faro_topes.py tests/test_faro_control.py tests/test_faro_lanzador.py tests/test_faro_acl.py tests/test_faro_memoria.py -v
      - run: |
          python -m pytest tests/test_faro_paquete.py tests/test_faro_puerto.py tests/test_faro_puerto_e2e.py tests/test_faro_transporte.py tests/test_faro_cadena.py tests/test_faro_requirements.py tests/test_faro_aviso.py tests/test_faro_topes.py tests/test_faro_control.py tests/test_faro_lanzador.py tests/test_faro_acl.py tests/test_faro_memoria.py -q 2>&1 | tee /tmp/faro
          python3 .github/ci/piso.py verificar faro-fase0/faro /tmp/faro || exit $?
          if grep -qE "skipped" /tmp/faro; then
            echo "HAY TESTS SALTADOS: el Faro se ejercita completo o no cuenta."; exit 1; fi

  # El Faro: la bitacora durable (auditoria MAJOR-5). Tabla encadenada con hash previo y un usuario de
  # base que SOLO tiene INSERT, contra una MariaDB 12.3.3 EFIMERA (el service de este job, que muere con
  # el). Piso exacto de 40 tests corridos (bitacora 22 + topes 18: el conteo atomico, N hilos contra un tope
  # de N-1), cero saltados: sin FARO_TEST_DB_ADMIN las pruebas se saltan, y un skip se ve igual que verde.
  faro-bitacora-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PYTHONPATH: .
      FARO_TEST_DB_ADMIN: "127.0.0.1:3306:root:ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-faro.txt
      - run: pip install --require-hashes -r requirements-faro-ci.txt
      - run: python -m pytest tests/test_faro_bitacora_db.py tests/test_faro_topes_db.py -v
      - run: |
          python -m pytest tests/test_faro_bitacora_db.py tests/test_faro_topes_db.py -q 2>&1 | tee /tmp/faro-db
          python3 .github/ci/piso.py verificar faro-bitacora-db/faro-db /tmp/faro-db || exit $?
          if grep -qE "skipped" /tmp/faro-db; then
            echo "HAY TESTS SALTADOS: la bitacora se prueba contra una base real o no cuenta."; exit 1; fi

  # El Faro, paso 0.3c: la jaula y el canal de control con bwrap REAL y uids REALES (nobody, daemon, www-data
  # via `sudo setpriv`; el runner de GitHub trae sudo sin contrasena). Instala bubblewrap y suelta la
  # restriccion de namespaces de usuario sin privilegios del kernel, igual que el job de cli_sandbox. Piso
  # exacto de 11 tests corridos, cero saltados: sin bwrap o sin sudo las pruebas se saltan y un skip se ve igual
  # que verde. Medido 2026-10-02 en hall9000 (bubblewrap 0.11.1, Python 3.12). Incluye bwrap CORRIENDO COMO el uid de
  # la jaula (nobody) con sus fuentes en el directorio 0700 de faro, gracias a la ACL por ejecucion, y visudo -cf del
  # sudoers de ejemplo.
  faro-jaula:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar bubblewrap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "(sysctl ausente en este kernel -- no aplica)"
          bwrap --version
      - run: pip install --require-hashes -r requirements-faro.txt
      - run: pip install --require-hashes -r requirements-faro-ci.txt
      - run: python -m pytest tests/test_faro_jaula_real.py -v
      - run: |
          python -m pytest tests/test_faro_jaula_real.py -q 2>&1 | tee /tmp/faro-jaula
          python3 .github/ci/piso.py verificar faro-jaula/faro-jaula /tmp/faro-jaula || exit $?
          if grep -qE "skipped" /tmp/faro-jaula; then
            echo "HAY TESTS SALTADOS: la jaula se ejercita con bwrap y uids reales o no cuenta."; exit 1; fi

  # Task 6 del plan de alertas nacio con 11 tests y CERO jobs que los
  # corrieran -- tercera instancia del mismo hueco en el mes (ver la octava
  # leccion de metodo en CONTEXT.md). Este job es la correccion, y se
  # verifico rompiendo un test a proposito y confirmando que se pone ROJO:
  # que aparezca aca y salga verde no alcanza.
  #
  # Instala aiomysql y pydantic, a diferencia de los otros jobs que solo
  # necesitan pytest: los tests son de logica PURA, pero importan
  # `jacobs.facet_health`, que hace `from jacobs import store` a nivel de
  # modulo -> aiomysql, y `store` importa `jacobs.models` -> pydantic. Con
  # solo pytest el job falla en la COLECCION (ModuleNotFoundError), no en
  # un assert -- verificado en un venv limpio antes de escribir esto, no
  # supuesto. Se instalan las deps en vez de diferir el import para que el
  # job ejercite la MISMA cadena de imports que carga produccion.
  facet-health-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      - run: pip install -r requirements.txt pytest
      # PYTHONPATH=las_manos (2026-09-17): jacobs/facet_health.py importa
      # `redaccion`, que vive en jax/core y se alcanza por el symlink de
      # las_manos/. Sin esto el job muere en la colección con
      # ModuleNotFoundError, no por el código bajo prueba.
      - run: PYTHONPATH=las_manos python -m pytest jacobs/_facet_health_test.py -v

  # `check_facet_health()` es la unica pieza del lector sin cobertura
  # automatica: `evaluate_states`/`transitions_to_notify` tienen 11 tests
  # puros, pero las tres consultas, el envio, el ledger y la poda no tenian
  # ninguno -- y su `except` en el reaper es fail-soft, asi que un fallo ahi
  # se ve IGUAL que un sistema sano. Este job cierra eso.
  #
  # Necesita una MariaDB de verdad (service container), no un doble: lo que
  # se prueba ES el I/O. La base se llama jax_memory_test porque el test se
  # niega a correr contra una base cuyo nombre no termina en `_test` -- la
  # funcion bajo prueba BORRA sin filtrar por facet.
  #
  # Se verifico rompiendo el job REAL, no localmente (octava leccion).
  facet-health-io:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
      # Ruling R50 (2026-09-17): la MariaDB de ESTE job es un service container
      # propio (base exclusiva, nadie más escribe facet_health_event/alert), así
      # que acá corren los tres tests de aserción global de
      # jacobs/_facet_health_io_test.py (__system__, tabla vacía, supresión 6h).
      # En cualquier otro lado (jax_memory_test compartida) se saltan. Único
      # lugar que define la variable (lo fija tests/test_facet_health_tabla_exclusiva.py).
      JAX_TEST_FACET_HEALTH_TABLA_EXCLUSIVA: "1"
      # las_manos en el path desde E-24 (2026-09-16): jacobs/plan.py, executor.py
      # y reaper.py importan `cliente_http_compartido` por su nombre corto, como
      # corren en produccion (dentro de LAS MANOS, con las_manos/ en sys.path).
      # Importarlo como jax.core.* daria OTRO modulo y otro cliente, que el
      # shutdown de LAS MANOS no cierra. Sin esto el job no colecta (visto en
      # rojo al rebasar el frente E: ModuleNotFoundError en la coleccion).
      PYTHONPATH: las_manos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # httpx ademas de aiomysql/pydantic: el test parchea
      # `reaper.send_telegram_alert`, y para eso importa `jacobs.reaper`,
      # que importa httpx a nivel de modulo. Sin el, el job falla en la
      # COLECCION y no en un assert -- el mismo modo de falla que rompio
      # PR#25 en la ronda anterior.
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      - run: pip install -r requirements.txt pytest
      # El guard de "no correr sin DB" es un skipif: un skip masivo se ve
      # como verde. Se exige que los 6 tests CORRAN de verdad.
      - run: python -m pytest jacobs/_facet_health_io_test.py jacobs/_store_indexes_test.py -v
      - run: |
          python -m pytest jacobs/_facet_health_io_test.py jacobs/_store_indexes_test.py \
            -q 2>&1 | tee /tmp/out
          python3 .github/ci/piso.py verificar facet-health-io/out /tmp/out || exit $?

  # Task 9 (2026-09-18, historial-y-arreglos-de-pipeline): el historial de la
  # Mesa necesita prompt/modelo_real/depends_on por paso en
  # GET /pipeline/{id}/results (jacobs/routes.py:get_pipeline_results). Las
  # tablas que necesita (jacobs_pipelines/jacobs_steps) las crea ESTE repo con
  # store.init_tables(): no hace falta el esquema de jax-platform, mismo
  # motivo que facet-health-io de arriba.
  pipeline-results-historial-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
      PYTHONPATH: .:las_manos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest jacobs/_pipeline_results_historial_test.py -v
      - run: |
          python -m pytest jacobs/_pipeline_results_historial_test.py -q 2>&1 | tee /tmp/out
          python3 .github/ci/piso.py verificar pipeline-results-historial-db/out /tmp/out || exit $?

  # Frente F (2026-09-16): contrato de sub-pipelines contra una MariaDB REAL.
  # Las tablas de Jacobs (jacobs_pipelines/steps/events y la nueva
  # jacobs_subpipeline_tokens) las crea ESTE repo con store.init_tables(): no
  # hace falta clonar jax-platform. PYTHONPATH incluye las_manos/ porque la
  # ruta importa executor -> credential_resolver (sin eso, error de coleccion).
  # Deps medidas en un venv limpio antes de escribir esta lista.
  #
  # Lo que prueba y por que necesita base: la carrera de consumos (20 a la vez
  # y un intercalado forzado con dos sesiones) y el EXPLAIN de la SQL real no
  # existen sin InnoDB de verdad. Un doble de la base daria verde sin probar
  # la atomicidad.
  #
  # Todo sale de requirements.txt (E-19; rebase del frente F sobre de6964e,
  # 2026-09-17): jacobs/store.py depende de comportamiento de aiomysql revisado
  # a mano, y jacobs/_store_pool_test.py::VersionDeAiomysqlTest falla si la
  # instalada no es la revisada. Sin aiofiles (E-18 lo retiro).
  subpipeline-contrato-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
      # 2026-09-25: jax-platform#155 (fix(migrations): bootstrap canonical B9
      # core schema, integrado 09:04Z) hizo que _apply_jax_b9_core_migrations y
      # _apply_jax_project_authority_migration (backend/db/migrations.py:21,
      # ~97 y ~147 de jax-platform) exijan JAX_REPO_PATH para cargar
      # jax/memory/b9_migrations y project_authority_migrations.py -- DDL que
      # jax-platform NO copia, sólo ejecuta desde el checkout de JAX. Sin esta
      # variable el paso "Esquema de gobernanza con SUS migraciones" muere con
      # RuntimeError: JAX_REPO_PATH is required to run JAX-owned B9 migrations
      # (y un RuntimeError: Event loop is closed secundario, del pool que no
      # llega a cerrarse limpio tras la excepción). github.workspace es el
      # checkout de ESTE repo (jax) que ya trae el actions/checkout@v4 de
      # arriba: es el árbol dueño de esas migraciones, no una copia.
      JAX_REPO_PATH: ${{ github.workspace }}
      PYTHONPATH: .:las_manos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # 2026-09-17 (pre-vuelo y continuar): crear un pipeline ahora pasa por el
      # pre-vuelo, que lee `facet`, `model`, `capability` y `credential` -- tablas
      # que crean las migraciones de jax-platform, no init_tables() de Jacobs. Sin
      # este paso el job muere con "Table 'jax_memory_test.facet' doesn't exist",
      # que no es un fallo del codigo bajo prueba. Mismo patron que el job
      # jacobs-gobernanza-db.
      - name: Clonar jax-platform (sus migraciones crean la gobernanza)
        run: git clone --depth=1 https://github.com/fjruizhn/jax-platform.git /tmp/jax-platform
      - run: pip install -r /tmp/jax-platform/backend/requirements.txt
      - name: Esquema de MEMORIA de jax (projects -- FK de la migracion 003)
        # jax-platform#155 agrego jax_project_scope.project_id -> projects(id)
        # a la migracion 003 (jax/memory/project_authority_migrations.py).
        # `projects` es DDL de JAX (jax_memory_schema.sql:149), no de
        # jax-platform -- run_migrations() nunca la crea (cero CREATE TABLE
        # projects en backend/db/migrations.py, verificado). Sin este paso
        # "Esquema de gobernanza con SUS migraciones" muere con:
        #   pymysql.err.OperationalError: (1005, "Can't create table
        #   `jax_memory_test`.`jax_project_scope` (errno: 150 'Foreign key
        #   constraint is incorrectly formed')")
        #
        # Mismo tratamiento sed/mysql que ~/jax-platform/.github/workflows/policy.yml
        # (job backend-tests-con-db, paso "Crear el esquema de MEMORIA..."): el
        # cliente mysql/mariadb parte las sentencias, nunca un split a mano en
        # Python (hay ';' dentro de sentencias, p.ej. el DEFAULT del vector cero
        # de embedding_bge_m3). El unico recorte es el encabezado CREATE
        # DATABASE/USE jax_memory -- la base ya la crea
        # services.mariadb.env.MARIADB_DATABASE de este job; ninguna sentencia
        # CREATE TABLE se toca. No clona jax: este job YA es el checkout de jax
        # (actions/checkout@v4 de arriba), a diferencia de backend-tests-con-db
        # (que clona jax en otro repo, jax-platform).
        #
        # ORDEN (jax-platform backend/base_de_test.py:539-546): la migracion 003
        # corre DESPUES de jax_tenants, dentro del propio run_migrations() (que
        # crea jax_tenants antes de llamar a
        # _apply_jax_project_authority_migration). jax_memory_schema.sql NO
        # trae jax_project_scope -- esa tabla es solo del runner de plataforma
        # -- asi que no hay colision entre este paso y run_migrations() de
        # abajo. No hace falta jacobs.store.init_tables() antes de este paso:
        # jax_memory_schema.sql no tiene ninguna FK hacia tablas de Jacobs (sus
        # unicas referencias son conversations/messages/projects, todas del
        # mismo archivo) -- el orden init_tables -> schema.sql de
        # backend-tests-con-db es para SUS propios tests, que si tocan
        # jacobs.store; este job no lo necesita para que la migracion 003
        # resuelva su FK.
        run: |
          sed -e '/^CREATE DATABASE IF NOT EXISTS jax_memory$/,/;$/d' \
              -e "s/^USE jax_memory;$/USE \`$JAX_DB_NAME\`;/" \
              jax_memory_schema.sql \
            | mysql -h "$JAX_DB_HOST" -P "$JAX_DB_PORT" -u"$JAX_DB_USER" -p"$JAX_DB_PASSWORD" "$JAX_DB_NAME"
      - name: Esquema de gobernanza con SUS migraciones
        working-directory: /tmp/jax-platform/backend
        run: |
          python - <<'PY'
          import asyncio
          from db.connection import close_pool
          from db.migrations import run_migrations

          async def main():
              await run_migrations()
              await close_pool()

          asyncio.run(main())
          print("run_migrations OK")
          PY
      - run: python -m pytest -v jacobs/_subpipeline_contrato_io_test.py tests/test_subpipeline_contrato_rutas.py jacobs/_store_pool_test.py las_manos/_human_gate_io_test.py jacobs/_cupo_io_test.py jacobs/_pipeline_identity_test.py jacobs/_step_motor_test.py jacobs/_devolucion_persistencia_test.py tests/test_project_authority_mariadb.py tests/test_project_queries_mariadb.py tests/test_proyectos_e1_fks_mariadb.py tests/test_proyectos_e1_migrar_mariadb.py tests/test_project_documents_schema_mariadb.py tests/test_proyecto_activo_mariadb.py tests/test_proyectos_e2a_lactovi_mariadb.py scripts/_b9_revertir_005_test.py
      - name: Piso exacto de tests CORRIDOS
        # Los dos archivos se saltan sin JAX_DB_HOST: un skip masivo se ve verde.
        run: |
          python -m pytest -q jacobs/_subpipeline_contrato_io_test.py \
            tests/test_subpipeline_contrato_rutas.py jacobs/_store_pool_test.py \
            las_manos/_human_gate_io_test.py jacobs/_cupo_io_test.py \
            jacobs/_pipeline_identity_test.py jacobs/_step_motor_test.py \
            jacobs/_devolucion_persistencia_test.py tests/test_project_authority_mariadb.py \
            tests/test_project_queries_mariadb.py tests/test_proyectos_e1_fks_mariadb.py \
            tests/test_proyectos_e1_migrar_mariadb.py tests/test_project_documents_schema_mariadb.py \
            tests/test_proyecto_activo_mariadb.py tests/test_proyectos_e2a_lactovi_mariadb.py scripts/_b9_revertir_005_test.py 2>&1 | tee /tmp/out
          python3 .github/ci/piso.py verificar subpipeline-contrato-db/out /tmp/out || exit $?

  # Busqueda vectorial de la memoria contra embeddings "vector cero"
  # (2026-09-11). El 500 del chat de ese dia salio de VEC_DISTANCE_COSINE
  # contra filas de norma cero: da NaN, que `IS NULL` no atrapa, que el
  # ORDER BY ubica en cualquier lado y que aiomysql entrega como None en un
  # camino y como 0.0 en otro. Nada de eso lo reproduce un doble -- no
  # calcula distancias --, asi que el test corre contra una MariaDB real.
  # Mismo patron que facet-health-io: la base termina en _test y se exige que
  # los tests CORRAN (el guard es un skipif, y un skip masivo se ve verde).
  #
  # Verificado por mutacion antes de publicar: sin la exclusion en SQL cae
  # el test de facts (el NaN que llega como 0.0, que el filtro en Python no
  # puede ver); sin el chequeo de consulta degenerada ni el filtro de
  # distancias finitas cae el de consulta degenerada.
  memory-vector-zero-io:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # httpx: jax/memory/db.py lo importa a nivel de modulo (get_embedding).
      # cryptography: tests/test_worker_backfill.py importa jax.memory.worker,
      # que trae jax.muscles.base -> jax.core.crypto_secrets. Sin el, ese
      # archivo NO COLECTA. Medido 2026-09-11 en un venv limpio con solo este
      # pip install (no en hall9000, donde todo esta instalado): con los 4
      # paquetes, 10 tests colectados; sin cryptography, error de coleccion.
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      # B9 persistence/authority tests are async; use the same supported
      # plugin contract as the other async database jobs.
      # The cross-transaction delete/adoption race belongs to the isolated
      # memory-b9-regression database job; do not run it against this job's
      # separate jax_memory_test schema.
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: >-
          PYTHONPATH=. python -m pytest -v --junitxml=/tmp/b9-memory-first.xml
          -k 'not test_m1_real_mariadb_delete_and_adoption_serialise_on_legacy_fact'
          tests/test_memory_vector_zero_io.py tests/test_worker_backfill.py
          tests/test_memory_scope_denormalized.py tests/test_migrar_embeddings_io.py
          tests/test_memoria_facts_comportamiento.py tests/test_memoria_retorno_no_ambiguo.py
          tests/test_accion_persona_retorno_no_ambiguo.py
          tests/test_memoria_caducidad_no_es_agujero.py tests/test_indice_vectorial.py
          tests/test_memoria_busqueda_facts.py
          tests/test_b9_lifecycle_worker.py tests/test_b9_mariadb_adapter.py
          tests/test_b9_persistent_api.py tests/test_b9_embedding_mapping_e2e.py tests/test_b9_scope_authority.py
          tests/test_b9_shared_memory.py tests/test_b9_systemd_ownership.py
          tests/test_b9_worker_composition.py tests/test_project_scope_authority.py
      - name: Publicar fallos de memoria B9
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('/tmp/b9-memory-first.xml')
          if path.exists():
              for case in ET.parse(path).iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      summary = (failure.get('message') or failure.text or 'pytest failure').splitlines()[0][:240]
                      summary = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title=B9 memory test::{case.get('classname')}.{case.get('name')}: {summary}")
          PY
      # 8 contra la DB (4 de busqueda + 4 del backfill de embeddings en ceros)
      # + 2 puros del worker. Subido de 4 a 10 el 2026-09-11 (reintento de
      # embeddings en el worker): cada test nuevo se vio en rojo antes del
      # arreglo y, por mutacion, cada pieza del arreglo tiene un test que cae
      # sin ella.
      - run: |
          PYTHONPATH=. python -m pytest -q \
            -k 'not test_m1_real_mariadb_delete_and_adoption_serialise_on_legacy_fact' \
            tests/test_memory_vector_zero_io.py tests/test_worker_backfill.py \
            tests/test_memory_scope_denormalized.py tests/test_migrar_embeddings_io.py \
            tests/test_memoria_facts_comportamiento.py tests/test_memoria_retorno_no_ambiguo.py \
            tests/test_accion_persona_retorno_no_ambiguo.py \
            tests/test_memoria_caducidad_no_es_agujero.py tests/test_indice_vectorial.py \
            tests/test_memoria_busqueda_facts.py \
            tests/test_b9_lifecycle_worker.py tests/test_b9_mariadb_adapter.py \
            tests/test_b9_persistent_api.py tests/test_b9_embedding_mapping_e2e.py tests/test_b9_scope_authority.py \
            tests/test_b9_shared_memory.py tests/test_b9_systemd_ownership.py \
            tests/test_b9_worker_composition.py tests/test_project_scope_authority.py 2>&1 | tee /tmp/out
          python3 .github/ci/piso.py verificar memory-vector-zero-io/out /tmp/out || exit $?
      - name: Publicar resumen de segunda corrida de memoria
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('/tmp/out')
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              for line in lines:
                  if re.match(r'^(FAILED|ERROR) [^\s]+', line):
                      name = line.split(' ', 2)[1]
                      print(f'::error title=B9 memory repeat testcase::{name}')
              for line in reversed(lines):
                  if re.search(r'\b\d+ (?:passed|failed|error|errors|skipped)\b', line):
                      summary = line.strip('= ').replace('%', '%25')[:240]
                      print(f'::error title=B9 memory repeat summary::{summary}')
                      break
          PY

  output-validator-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: PYTHONPATH=las_manos python -m pytest las_manos/_output_validator_test.py -v

  # Sello de invalidacion cross-proceso del cache de facet_resolver (Q3,
  # 2026-09-01). El job de al lado (facet-resolver-sync) verifica que los dos
  # espejos NO diverjan; este verifica que lo que hacen sea lo correcto -- son
  # dos preguntas distintas y hacen falta las dos: dos copias identicas del
  # mismo bug pasan el checker de drift en verde.
  #
  # PYTHONPATH=las_manos a proposito: `las_manos/facet_resolver.py` es un
  # symlink a `jax/core/facet_resolver.py`, asi que este job ejercita el
  # archivo real por el camino de import de Jacobs -- uno de los dos procesos
  # que hasta hoy no se enteraban de un rebind.
  #
  # aiomysql y cryptography ademas de pytest: los tests son de logica PURA
  # (parchean `_query_facet`, no tocan MariaDB), pero el modulo importa
  # aiomysql a nivel de modulo y arrastra credential_resolver -> crypto_secrets
  # -> cryptography.fernet. Con solo pytest el job falla en la COLECCION y no
  # en un assert -- verificado en un venv limpio antes de escribir esto, mismo
  # modo de falla que rompio PR#25.
  #
  # El test se auto-verifica por MUTACION: cambiando `fetched_at_wall` por
  # `fetched_at` en `_entrada_sellada` (que es el modo de falla silencioso de
  # este arreglo: comparar un mtime contra time.monotonic()) se ponen en rojo
  # los dos tests de monotonic. Verificado, no supuesto.
  # Contenimiento del sandbox de Hyde, EJERCITADO.
  #
  # POR QUE EXISTE. hyde_sandbox.py afirma propiedades de seguridad (repos en
  # solo-lectura, $HOME real no expuesto, entorno del padre no heredado) que se
  # verificaron UNA VEZ a mano al escribirlo (2026-08-23) y nunca mas.
  # `_hyde_sandbox_test.py`, el unico test que existia, cubre el flock y los
  # timeouts -- la SERIALIZACION, no el CONFINAMIENTO. Cambiar un --ro-bind por
  # un --bind no rompia ningun test: el sandbox seguia arrancando, Hyde seguia
  # funcionando, y el confinamiento se perdia en silencio.
  #
  # Los tests EJECUTAN ataques reales adentro del sandbox y, cuando el ataque es
  # una escritura, afirman SOBRE EL HOST -- un `touch` puede "fallar" y aun asi
  # haber dejado el archivo. Se auto-verifican por mutacion: cambiando
  # --ro-bind por --bind caen 3 (verificado, no supuesto).
  #
  # CORREGIDO 2026-09-27 (segunda auditoria adversarial sobre el fix del token
  # OAuth de Hyde): esta linea decia "quitando --clearenv caen 2" -- desde B-1
  # de esa auditoria, bwrap ya NO usa --clearenv/--setenv en absoluto (la
  # frontera de entorno paso a ser el `env=` que run_sandboxed_claude pasa a
  # create_subprocess_exec, ver hyde_sandbox.py), asi que esa mutacion ya no
  # existe. La equivalente hoy -- quitar ese `env=` o fusionarlo con
  # os.environ en run_sandboxed_claude -- se verifico a mano (las dos
  # variantes): pone en rojo **1** test, y solo en
  # _hyde_sandbox_test.py::RunSandboxedClaudeWrappingTest, nunca en
  # _hyde_containment_test.py -- su Caja.correr llama a wrap_hyde_command
  # DIRECTO, sin pasar por run_sandboxed_claude, asi que este job (que solo
  # corre _hyde_containment_test.py) no puede ejercitar esa propiedad; la
  # ejercita el job hyde-sandbox-unit, mas abajo.
  #
  # bubblewrap no viene en el runner. Y en Ubuntu 23.10+ AppArmor bloquea los
  # user namespaces sin privilegios, que es justamente lo que bwrap necesita:
  # se baja el sysctl, tolerando que no exista en kernels donde no aplica.
  hyde-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Instalar bubblewrap y habilitar user namespaces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "(sysctl ausente en este kernel -- no aplica)"
          bwrap --version
      - run: python -m pytest _hyde_containment_test.py -v
      # El archivo entero se auto-saltea si falta bwrap (skipif de modulo), y un
      # skip masivo se ve igual que verde. Se exige el numero real.
      #
      # Piso subido de 14 a 21 el 2026-09-27 (fix del token OAuth de Hyde,
      # segunda auditoria adversarial): 7 tests nuevos de la credencial
      # (CLAUDE_CODE_OAUTH_TOKEN vs REAL_CREDENTIALS, ver hyde_sandbox.py) --
      # medido dos veces contra el arbol real, sin DB de por medio.
      - run: |
          python -m pytest _hyde_containment_test.py -q 2>&1 | tee /tmp/hyde
          python3 .github/ci/piso.py verificar hyde-containment/hyde /tmp/hyde || exit $?

  facet-resolver-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=las_manos python -m pytest las_manos/_facet_resolver_seal_test.py -v
      # Los 13 tests tienen que CORRER, no saltarse: dos de ellos se saltan
      # solos si el runner corriera como root (ningun permiso bloquea a root,
      # asi que los casos de sello ilegible / no escribible no son
      # reproducibles). Un skip masivo se ve igual que verde -- este paso
      # exige el numero.
      - run: |
          PYTHONPATH=las_manos python -m pytest las_manos/_facet_resolver_seal_test.py -q 2>&1 | tee /tmp/seal
          python3 .github/ci/piso.py verificar facet-resolver-seal/seal /tmp/seal || exit $?

  # Renombrado de `facet-resolver-sync` el 2026-09-01: el checker se generalizo
  # a FAMILIAS de espejos y ahora cubre tambien credential_resolver.
  #
  # POR QUE EXISTE: el patron declarado "sin paquete compartido" replica modulos
  # a proposito entre repos, y su costo conocido es que un arreglo hecho en una
  # copia y no en la otra queda invisible. Ese costo ya se cobro TRES veces en
  # 2026 -- facet_resolver._db_conn, los cuatro sitios del default a la
  # instancia muerta 3306, y credential_resolver._db_conn -- siempre con la
  # misma forma: se cierra en un repo y sobrevive en el otro.
  #
  # credential_resolver tuvo TRES archivos reales hasta el 2026-09-16: la copia
  # de las_manos/ no era symlink. Desde E-11 lo es (igual crypto_secrets, E-10,
  # y model_catalog), asi que dentro de jax queda un solo archivo por modulo.
  # El techo declarado en capability.max_execution_minutes es un techo de
  # verdad (2026-09-01). Antes no lo era: un timeout_seconds explicito en el
  # spec de un step pisaba el default y llegaba intacto a asyncio.wait_for --
  # la columna se podia editar en un panel admin creyendo que cambiaba algo.
  #
  # Los tests parchean get_motor_governance: prueban la POLITICA, no el I/O, y
  # no necesitan DB. Se auto-verifican por mutacion -- quitando el chequeo del
  # techo caen 9 de 14 (verificado, no supuesto).
  #
  # Deps medidas en un venv limpio, no supuestas: jacobs.plan arrastra
  # store -> aiomysql, models -> pydantic, reaper -> httpx y
  # credential_resolver -> crypto_secrets -> cryptography. Con solo pytest el
  # job falla en la COLECCION y no en un assert.
  #
  # PYTHONPATH=las_manos: es el camino de import de Jacobs (plan.py importa
  # `credential_resolver` pelado, que vive en las_manos/).
  plan-timeout-ceiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=las_manos python -m pytest jacobs/_plan_timeout_ceiling_test.py -v
      - run: |
          PYTHONPATH=las_manos python -m pytest jacobs/_plan_timeout_ceiling_test.py -q 2>&1 | tee /tmp/ptc
          python3 .github/ci/piso.py verificar plan-timeout-ceiling/ptc /tmp/ptc || exit $?

  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Traer el checkout de jax-platform
        run: git clone --depth=1 https://github.com/fjruizhn/jax-platform.git /tmp/jax-platform
      - name: Comparar las familias de espejos
        env:
          JAX_PLATFORM_REPO_ROOT: /tmp/jax-platform
        run: python3 scripts/check_mirror_sync.py
      # La LOGICA del comparador tiene sus propios tests, sobre fuentes
      # sinteticas. Existen porque probar el checker rompiendolo encontro un
      # defecto real: el marcador de "divergencia deliberada" no funcionaba para
      # constantes de modulo (no tienen docstring, y los comentarios no estan en
      # el AST). Una verificacion a mano que encuentra un defecto y no queda
      # escrita hay que volver a hacerla.
      - run: python -m pytest scripts/_check_mirror_sync_test.py -v
      - run: |
          python -m pytest scripts/_check_mirror_sync_test.py -q 2>&1 | tee /tmp/ms
          python3 .github/ci/piso.py verificar mirror-sync/ms /tmp/ms || exit $?
      # La comparacion por AST de la familia `cola_uso` contra la copia REAL de
      # jax-platform (Task 7, 2026-09-15). Corre ACA y no en tests-puros porque
      # este es el unico job con el checkout de jax-platform: alla el mismo test
      # se saltea, y un skip no compara nada. `check_mirror_sync.py` de arriba
      # ya sale con exit 2 si backend/uso/cola.py no esta -- ORDEN DE MERGE: la
      # plataforma primero.
      #
      # aiomysql: tests/test_cola_uso_escritores.py importa los dos escritores
      # reales, y los dos importan aiomysql. Con solo pytest el job fallaria en
      # la COLECCION, que es un rojo por otra razon.
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      - run: pip install -r requirements.txt
      - name: La copia de cola_uso.py es identica a la de jax-platform
        env:
          JAX_PLATFORM_REPO_ROOT: /tmp/jax-platform
          PYTHONPATH: .:las_manos
        run: python -m pytest tests/test_cola_uso_escritores.py -v
      - name: Piso exacto de tests CORRIDOS (0 skipped, con el checkout presente)
        env:
          JAX_PLATFORM_REPO_ROOT: /tmp/jax-platform
          PYTHONPATH: .:las_manos
        # 15 y no "14 + el de la comparacion": si el checkout estuviera y el
        # test se salteara igual, esto seria "14 passed, 1 skipped" y el grep
        # falla. Un control que no falla cuando la comparacion no ocurre no
        # valida la comparacion.
        #
        # Sigue en 15 el 2026-09-15 (Task 8b, el contrato pasa a TRECE campos):
        # el cambio endurece tests que ya existian y reescribe uno en su
        # contrario; no agrega ni quita archivos de test. Medido dos veces:
        # 15 passed, 0 skipped, con JAX_PLATFORM_REPO_ROOT apuntando a un
        # checkout real de jax-platform.
        # 15 -> 17 el 2026-09-18 (Task 7b, historial-y-arreglos-de-pipeline): el
        # contrato pasa a CATORCE campos (pipeline_id). +2:
        # test_jacobs_encola_pipeline_id_null_cuando_el_uso_no_viene_de_un_pipeline

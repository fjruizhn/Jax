          # (+1). Los 5 primeros de esa lista (17 tests) pasan limpio; DOS arrastran la
          # MISMA dependencia de orden de despliegue que ya declaraba el bloque de arriba:
          # jacobs/_usage_writer_test.py::DirectUsageWriterTest (4 tests, los 4 rojos hoy
          # -- mismo motivo que las_manos/_motor_usage_writer_test.py, Task 7b) y
          # las_manos/_catalog_from_db_test.py (2 de 4 rojos hoy -- mismo motivo que
          # test_plan_validation.py/test_plan_capability_hint.py más arriba,
          # _seed_ada_kimi_has_tool_access pendiente en jax-platform master). Ningún
          # test nuevo, ninguna falla nueva: exactamente el mismo bloqueo que ya
          # tenía este job, contado dos veces más porque estos dos archivos también
          # ejercitan esas dos columnas. Medido contra una MariaDB 11.8 efímera fresca
          # en Docker (no la de producción), con las migraciones reales de jax-platform
          # clonadas en frío: 92 -> 120 si las dos dependencias de jax-platform están en
          # master; hoy, con las dos pendientes, salen 13 rojos (7 de antes + 6 de estos
          # dos archivos) y 107 passed -- el mismo "CI se queda rojo hasta que..." de
          # arriba, no una regresión de este cambio. Si el runner da otro número, manda
          # el runner.

  # ops/permisos_proyectos.py (2026-09-25, spec
  # docs/superpowers/specs/2026-09-22-proyectos-y-selector-design.md §5, corregido tras 3
  # BLOCK de la auditoría de escalón 3 sobre la primera versión en shell -- ver el propio
  # guion y tests/test_permisos_proyectos.py): proyectos/ del workspace queda dueño jaxsvc,
  # grupo fruiz con escritura, setgid, ACL de acceso y por defecto. Job propio, sin DB: la
  # parte (b) del test (sudo -u jaxsvc contra /home/fruiz/jax-workspace/proyectos real) se
  # salta sola fuera del host de producción de jax -- medido en hall9000 con
  # `sudo unshare --mount` tapando /home/fruiz/jax-workspace (tmpfs vacío encima, namespace
  # de montaje propio -- mismo método que usa el job arranque-instalado-versionado para
  # simular el runner real): 15 passed, 1 skipped.
  # ops/permisos_proyectos.py -- segunda ronda de auditoría (2026-09-25, 3 BLOCK/3
  # MAJOR/6 MINOR sobre la primera reescritura en Python, commit 4f117a7). El núcleo
  # privilegiado ahora vive instalado (root:root 0755) para que el proceso re-ejecutado
  # con sudo -n ... -I nunca importe nada del checkout -- este job instala esa misma
  # copia ANTES de correr los tests, igual que hace un operador real (ver el runbook).
  # Piso MEDIDO en un contenedor LIMPIO (no en hall9000, a propósito -- BLOCK-3a: el
  # respaldo en el HOME de fruiz rompía en un runner sin ese directorio, y el propio
  # usuario que corre los tests, que en GitHub Actions se llama "runner", no "fruiz",
  # destapó una segunda categoría de fallos): `docker run ubuntu:24.04` con un usuario
  # `runner` con NOPASSWD:ALL (mismo esquema que el runner real de GitHub Actions),
  # `acl` instalado, sin ningún checkout previo -- 28 passed, 1 skipped (el que necesita
  # /home/fruiz/jax-workspace/proyectos real, que ningún runner de GitHub Actions tiene).
  # Si esto da "29 passed", este runner SÍ tiene ese árbol -- no es el runner esperado.
  permisos-proyectos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y acl
      - run: pip install -r requirements.txt pytest
      - name: Dar a fruiz lo mínimo para correr el escritor de la prueba de herencia
        # Solo en runners de GitHub (VM desechable): en uno persistente no se dejan ACLs ni cuentas; ahí la prueba falla con su mensaje claro.
        if: runner.environment == 'github-hosted'
        # La prueba test_entrada_y_fuente_creadas_despues_heredan_grupo_setgid_y_acl_por_defecto
        # corre el escritor real COMO fruiz (quien opera en producción y está en la ACL), con el
        # intérprete de pytest. En el runner, el checkout (/home/runner/work/...) y el intérprete
        # (/opt/hostedtoolcache/...) solo los lee el usuario `runner`: sin esto la prueba falla con
        # su mensaje «el usuario fruiz no puede leer ...». Se crea la cuenta aquí (idempotente, igual
        # que la fixture de la prueba) y se le da `x` en cada directorio padre y `rX` en el checkout y
        # en el prefijo del intérprete. El runner es una VM desechable: no hay riesgo en abrir esto.
        run: |
          for cuenta in jaxsvc fruiz; do getent passwd "$cuenta" >/dev/null || sudo useradd --system --no-create-home "$cuenta"; done  # Jax#340: las pruebas ya no crean cuentas
          PREFIJO=$(python -c 'import sys; print(sys.prefix)')
          for destino in "$GITHUB_WORKSPACE" "$PREFIJO"; do
            d=$(dirname "$destino")
            while [ "$d" != "/" ]; do
              sudo setfacl -m u:fruiz:x "$d"
              d=$(dirname "$d")
            done
            sudo setfacl -R -m u:fruiz:rX "$destino"
          done
          sudo -n -u fruiz test -r "$GITHUB_WORKSPACE" -a -x "$GITHUB_WORKSPACE"
          sudo -n -u fruiz test -r "$(python -c 'import sys; print(sys.executable)')"
      # Sin paso de "instalar el núcleo" (E2a, MAJOR-1 de la revisión de la Tarea 3): las pruebas
      # instalan su propia copia bajo el directorio temporal (JAX_PERMISOS_NUCLEO) y, solo si
      # /usr/local/sbin está libre, una temporal ahí que borran al terminar. Dejar el núcleo
      # instalado en el runner haría saltarse esas pruebas y movería el piso.
      - run: PYTHONPATH=. python -m pytest tests/test_permisos_proyectos.py -v
      - name: Piso exacto de tests CORRIDOS (no skipeados)
        # Medido 2026-09-25 (ronda 4, sobre 46223fd + los cambios de esta ronda) en un
        # contenedor LIMPIO ubuntu:24.04 (usuario runner, NOPASSWD:ALL, sin
        # /etc/jax/.env -- no en hall9000): 48 passed, 2 skipped. Sube de 39 a 48 (+9)
        # por los tests nuevos de la ronda 4 (m1: respaldo con FIFO/control negativo sin
        # FIFO; m2: bloque incompleto/marcador de fin faltante; m5: dos raices
        # posicionales/sudo -n roto; m6: group:: igual a la entrada nombrada/lo detecta
        # si diverge/unidad de _permiso_efectivo). Los dos skips siguen siendo
        # estructurales fuera de un host de jax real:
        # test_aplicar_rechaza_explicitamente_por_raiz_no_configurada_cuando_env_es_legible
        # (no hay /etc/jax/.env aca) y el test (b) de lectura/escritura cruzada contra
        # /home/fruiz/jax-workspace/proyectos real. Si esto da "50 passed", este runner
        # SI tiene ambos -- no es el runner esperado.
        # 48 -> 49 (2026-10-03, E2a Tarea 3): +1 test, entrada_y_fuente_creadas_despues_heredan_
        # grupo_setgid_y_acl_por_defecto (herencia a proyectos/<uuid>/entrada/<lote>/ y fuente/).
        # Delta medido en local (50 passed + 1 deseleccionado solo-host; sobre 48 + 2 del runner
        # esto da 49 + 2); manda el runner, el controlador lo re-mide.
        # 49 -> 50 (fix de revision, MAJOR-1): +1, test_las_pruebas_no_tocan_el_nucleo_de_sistema.
        # 50 -> 51 (2026-10-03, E2a): +1, test_en_profundidad_2_se_excluye_toda_carpeta_oculta_y_solo_las_ocultas
        # (la exclusion pasa de un nombre fijo a toda carpeta oculta de profundidad 2). Local: 52 passed + 1 solo-host.
        # Historia de los números del piso: docs/ci/pisos.md (los números viven en ci/pisos.json).
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_permisos_proyectos.py 2>&1 | tee /tmp/permisos_proyectos
          python3 .github/ci/piso.py verificar permisos-proyectos/permisos_proyectos /tmp/permisos_proyectos || exit $?

          #     migrador; reemplaza la cobertura de introspeccion, que las 5
          #     mutaciones del auditor no detectaban.
          #   tests/test_memoria_retorno_no_ambiguo.py (+7) -- verify_fact/
          #     expire_fact distinguen "no existe" de "no-op idempotente"

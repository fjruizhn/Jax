name: policy

# P10 (REFORMAS-v3.1.md, Apéndice C-bis): ningún validador/gate falla
# abierto ante error o excepción sin capturar. El enforcer mecánico
# (policy/tests/test_no_fail_open_except.py) existía desde 2026-08-19 pero
# nadie lo corría automáticamente -- ni pytest lo descubría (sin función
# test_*) ni había CI. Wireado 2026-08-20 (pago de deuda, ronda 3) tras
# encontrar 2 violaciones reales sin marcar en código de GAP2.
#
# CORREGIDO 2026-08-20 (ronda 4, T3): las rutas del scanner eran absolutas
# (/home/fruiz/jax, /home/fruiz/jax-platform) -- en este runner ninguna
# existe, así que este job era un NO-OP TOTAL desde que se wireó (ronda 3):
# "1 passed in 0.01s" en el log real, cero archivos escaneados, verde sin
# haber mirado nada. Confirmado con `gh run view --log` de las 2 corridas
# anteriores. Las rutas ahora se resuelven relativas al propio archivo del
# test -- portable a cualquier checkout, este incluido.
#
# Alcance conocido, real esta vez: este job solo escanea el árbol de este
# repo (jax). jax-platform es un repo GitHub privado separado sin checkout
# cruzado acá (necesitaría un PAT/secret nuevo -- decisión de
# infraestructura, no tomada esta sesión). jax-platform tiene su PROPIA
# copia de este scanner + workflow, escaneando solo su propio árbol --
# cobertura real por repo, sin depender de credenciales compartidas.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, edited]

# Ronda de pago de deuda 2026-08-25: `branches: [master]` dejaba a CUALQUIER
# PR de una cadena apilada (rama deuda/*-taskN con base deuda/*-taskN-1, no
# master) sin CI -- descubierto en vivo con PR jax#27 (0 runs hasta
# retargetear a master a mano). `branches: ["**"]` cubre cualquier base,
# no solo master. `types` agrega `edited` porque GitHub NO dispara
# pull_request con los tipos default (opened/synchronize/reopened) cuando
# se retarget-ea un PR existente -- sin esto, el propio retarget que
# resuelve el problema de arriba tampoco dispara una corrida sola.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-execution-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          # Root conftest deliberately pins all write-capable tests to this
          # test-only name; isolation comes from this job's fresh container.
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_EXECUTION_TEST_MARIADB: "1"
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Canonicalization is pinned to Unicode 16, supplied by Python 3.14.
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/policy/test_execution_mariadb_integration.py -v

  no-fail-open-except:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest policy/tests/test_no_fail_open_except.py -v
      - run: python -m pytest policy/tests/test_stderr_no_se_tira.py -v
      # Detector agregado 2026-09-20: un `run:` que no es bash valido mata el
      # job ANTES de que llegue a comprobar lo suyo, asi que el piso nunca se
      # compara y el hueco queda tapado por el verde del resto de la matriz.
      # Paso el mismo dia resolviendo un conflicto en el piso de tests-puros:
      # `yaml.safe_load` daba OK con el bash roto adentro -- parsear no es
      # validar. El detector se ejercita a si mismo con el bloque que fallo.
      - run: python -m pytest policy/tests/test_workflows_bash_valido.py -v
      # Detector agregado 2026-09-18 (ronda de arreglo del auditor local, hallazgo
      # CRÍTICO de la revisión): scripts/ejecutor_contratos/mision_de_humo.py validaba
      # el arranque contra la máquina de la misión (auditor local incluido) y auditaba
      # la entrega real con la faceta de NUBE, resuelta por su cuenta -- mismo criterio
      # de detector mecánico que P10, sin dependencias nuevas.
      - run: python -m pytest policy/tests/test_auditor_c5_punto_unico.py -v

  # Job propio, chico, sin dependencias pesadas (mismo criterio que no-fail-open-except):
  # la garantía de "cero GPU" del auditor local (2026-09-18, hallazgo ALTO de la revisión)
  # vive en ops/ejecutor/ollama-cpu.env.plantilla, no sólo en /etc/jax/ollama-cpu.env --
  # este job audita que las cuatro variables sigan escritas y vacías, y que el instalador
  # exija lo que hace falta y corra el canario. El canario en sí (una generación real
  # contra Ollama) no corre acá -- este runner no tiene la GPU ni el Ollama de hall9000;
  # se verificó a mano contra el proceso real (rojo con la config rota, verde restaurada,
  # ver ops/ejecutor/canario_ollama_cpu.sh y la Biblioteca de esta ronda).
  auditor-local-gpu-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/test_ejecutor_ollama_cpu_gpu_off.py -v

  # Detector de archivos de test sin job de CI (historial-y-arreglos-de-pipeline,
  # 2026-09-18). El hallazgo que lo motiva: de 6 archivos de test creados en
  # esta ronda, 5 no corrían en ningún job -- y las_manos/_tool_authority_test.py
  # (el jail de rutas del Ejecutor) llevaba MESES sin correr en CI porque nadie
  # se acordó de agregarlo a la lista de policy.yml. Este job no reemplaza esa
  # lista por otra lista: lee policy.yml con PyYAML y falla si encuentra un
  # archivo de test (tests/, jacobs/_*_test.py, las_manos/_*_test.py y
  # cualquier otro test_*.py/_*_test.py del árbol) que ningún `run:` de ningún
  # job invoque, salvo que esté declarado en EXCEPCIONES con motivo escrito.
  # Job propio, sin dependencias pesadas: solo pytest + pyyaml.
  archivos-de-test-en-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest policy/tests/test_archivos_de_test_wireados_en_ci.py -v
      - name: Piso exacto de tests CORRIDOS
        # Medido 2026-09-18 en venv limpio: 7 passed.
        run: |
          python -m pytest -q policy/tests/test_archivos_de_test_wireados_en_ci.py 2>&1 | tee /tmp/wireados
          grep -qE "^7 passed" /tmp/wireados || {
            echo "PISO ROTO: se esperaban 7 tests CORRIDOS."; exit 1; }

  ci-usa-la-mariadb-de-produccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sin dependencias: lee los YAML de este mismo repo. Sale != 0 si algun
      # workflow levanta una MariaDB distinta a la de produccion.
      - run: python3 policy/tests/test_ci_usa_la_mariadb_de_produccion.py

  no-naked-claude-subprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest policy/tests/test_claude_subprocess_solo_via_sandbox.py policy/tests/test_ejecutor_lanza_solo_con_contratos.py -v
      - name: Piso exacto de la guardia del arranque del Ejecutor
        # 5 tests (Ejecutor SP1 plan 6, 2026-09-17): nadie usa remoto_claude ni vigilar sin
        # exigir_contratos. Exacto: uno que desaparezca deja pasar un lanzador sin contratos.
        run: |
          python -m pytest -q policy/tests/test_ejecutor_lanza_solo_con_contratos.py 2>&1 | tee /tmp/lanza
          grep -qE "^5 passed" /tmp/lanza || { echo "PISO ROTO: se esperaban 5 tests CORRIDOS."; exit 1; }

  # El scanner de arriba (no-naked-claude-subprocess) protege que nadie
  # lance `claude` fuera de hyde_sandbox.py -- pero hasta 2026-08-25 la
  # COSA PROTEGIDA no se verificaba nunca en CI. _hyde_sandbox_test.py
  # (escrito en Task 1 del plan de gobernanza de subprocess) prueba
  # run_sandboxed_claude(), incluido un test real de dos procesos de SO
  # contra el flock(2) cross-proceso. Sin PYTHONPATH: hyde_sandbox.py y su
  # test viven los dos en el root del repo.
  hyde-sandbox-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest _hyde_sandbox_test.py -v

  # Task 6 del plan de alertas nacio con 11 tests y CERO jobs que los
  # corrieran -- tercera instancia del mismo hueco en el mes (ver la octava
  # leccion de metodo en CONTEXT.md). Este job es la correccion, y se
  # verifico rompiendo un test a proposito y confirmando que se pone ROJO:
  # que aparezca aca y salga verde no alcanza.
  #
  # Instala aiomysql y pydantic, a diferencia de los otros jobs que solo
  # necesitan pytest: los tests son de logica PURA, pero importan
  # `jacobs.facet_health`, que hace `from jacobs import store` a nivel de
  # modulo -> aiomysql, y `store` importa `jacobs.models` -> pydantic. Con
  # solo pytest el job falla en la COLECCION (ModuleNotFoundError), no en
  # un assert -- verificado en un venv limpio antes de escribir esto, no
  # supuesto. Se instalan las deps en vez de diferir el import para que el
  # job ejercite la MISMA cadena de imports que carga produccion.
  facet-health-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      - run: pip install -r requirements.txt pytest
      # PYTHONPATH=las_manos (2026-09-17): jacobs/facet_health.py importa
      # `redaccion`, que vive en jax/core y se alcanza por el symlink de
      # las_manos/. Sin esto el job muere en la colección con
      # ModuleNotFoundError, no por el código bajo prueba.
      - run: PYTHONPATH=las_manos python -m pytest jacobs/_facet_health_test.py -v

  # `check_facet_health()` es la unica pieza del lector sin cobertura
  # automatica: `evaluate_states`/`transitions_to_notify` tienen 11 tests
  # puros, pero las tres consultas, el envio, el ledger y la poda no tenian
  # ninguno -- y su `except` en el reaper es fail-soft, asi que un fallo ahi
  # se ve IGUAL que un sistema sano. Este job cierra eso.
  #
  # Necesita una MariaDB de verdad (service container), no un doble: lo que
  # se prueba ES el I/O. La base se llama jax_memory_test porque el test se
  # niega a correr contra una base cuyo nombre no termina en `_test` -- la
  # funcion bajo prueba BORRA sin filtrar por facet.
  #
  # Se verifico rompiendo el job REAL, no localmente (octava leccion).
  facet-health-io:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
      # Ruling R50 (2026-09-17): la MariaDB de ESTE job es un service container
      # propio (base exclusiva, nadie más escribe facet_health_event/alert), así
      # que acá corren los tres tests de aserción global de
      # jacobs/_facet_health_io_test.py (__system__, tabla vacía, supresión 6h).
      # En cualquier otro lado (jax_memory_test compartida) se saltan. Único
      # lugar que define la variable (lo fija tests/test_facet_health_tabla_exclusiva.py).
      JAX_TEST_FACET_HEALTH_TABLA_EXCLUSIVA: "1"
      # las_manos en el path desde E-24 (2026-09-16): jacobs/plan.py, executor.py
      # y reaper.py importan `cliente_http_compartido` por su nombre corto, como
      # corren en produccion (dentro de LAS MANOS, con las_manos/ en sys.path).
      # Importarlo como jax.core.* daria OTRO modulo y otro cliente, que el
      # shutdown de LAS MANOS no cierra. Sin esto el job no colecta (visto en
      # rojo al rebasar el frente E: ModuleNotFoundError en la coleccion).
      PYTHONPATH: las_manos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # httpx ademas de aiomysql/pydantic: el test parchea
      # `reaper.send_telegram_alert`, y para eso importa `jacobs.reaper`,
      # que importa httpx a nivel de modulo. Sin el, el job falla en la
      # COLECCION y no en un assert -- el mismo modo de falla que rompio
      # PR#25 en la ronda anterior.
      # Desde E-19 (2026-09-16) todo sale de requirements.txt.
      - run: pip install -r requirements.txt pytest
      # El guard de "no correr sin DB" es un skipif: un skip masivo se ve
      # como verde. Se exige que los 6 tests CORRAN de verdad.
      - run: python -m pytest jacobs/_facet_health_io_test.py jacobs/_store_indexes_test.py -v
      - run: |
          python -m pytest jacobs/_facet_health_io_test.py jacobs/_store_indexes_test.py \
            -q 2>&1 | tee /tmp/out
          # 6 -> 8 el 2026-09-11: _store_indexes_test.py aporta 2 (los indices
          # de las columnas por las que se filtra, y que init_tables() los cree
          # de forma idempotente). Corre aca y no en tests-puros porque necesita
          # una base VACIA: comprueba que las migraciones crean los indices en
          # un entorno nuevo, que es justo donde un ALTER a mano no llega.
          # 15 -> 8 el 2026-09-14 (PR-K ronda 4): jacobs/_direct_usage_test.py se
          #   mudo a jacobs-gobernanza-db -- en este job no existe el esquema de
          #   jax-platform (tabla `motor`), que validate_capability necesita (CI de
          #   Jax#158 rojo: 1146 "Table 'jax_memory_test.motor' doesn't exist").
          # 8 -> 9 el 2026-09-15 (Ruling T6-6): _store_indexes_test.py (+1) --
          #   idx_jacobs_pipelines_duenio (user_id, tenant_id, created_at) lo crea
          #   init_tables(); el test lo BORRA antes y lo exige de vuelta, porque la
          #   jax_memory_test local ya lo tenia y pasaba sin el cambio. Visto en rojo.
          # 9 sigue en 9 el 2026-09-17 (Ruling R50): los tres tests globales de
          #   _facet_health_io_test.py quedan detrás de JAX_TEST_FACET_HEALTH_TABLA_EXCLUSIVA,
          #   que este job define (base propia): corren acá. Fuera de este job (hall9000,
          #   base compartida) la misma lista da "6 passed, 3 skipped" -- no es este piso.
          grep -qE "^9 passed" /tmp/out || {
            echo "PISO ROTO: se esperaban 9 tests CORRIDOS (no skipeados)."; exit 1; }

  # Task 9 (2026-09-18, historial-y-arreglos-de-pipeline): el historial de la
  # Mesa necesita prompt/modelo_real/depends_on por paso en
  # GET /pipeline/{id}/results (jacobs/routes.py:get_pipeline_results). Las
  # tablas que necesita (jacobs_pipelines/jacobs_steps) las crea ESTE repo con
  # store.init_tables(): no hace falta el esquema de jax-platform, mismo
  # motivo que facet-health-io de arriba.
  pipeline-results-historial-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
      PYTHONPATH: .:las_manos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest jacobs/_pipeline_results_historial_test.py -v
      - run: |
          python -m pytest jacobs/_pipeline_results_historial_test.py -q 2>&1 | tee /tmp/out
          grep -qE "^2 passed" /tmp/out || {
            echo "PISO ROTO: se esperaban 2 tests CORRIDOS (no skipeados)."; exit 1; }

  # Frente F (2026-09-16): contrato de sub-pipelines contra una MariaDB REAL.
  # Las tablas de Jacobs (jacobs_pipelines/steps/events y la nueva
  # jacobs_subpipeline_tokens) las crea ESTE repo con store.init_tables(): no
  # hace falta clonar jax-platform. PYTHONPATH incluye las_manos/ porque la
  # ruta importa executor -> credential_resolver (sin eso, error de coleccion).
  # Deps medidas en un venv limpio antes de escribir esta lista.
  #
  # Lo que prueba y por que necesita base: la carrera de consumos (20 a la vez
  # y un intercalado forzado con dos sesiones) y el EXPLAIN de la SQL real no
  # existen sin InnoDB de verdad. Un doble de la base daria verde sin probar
  # la atomicidad.
  #
  # Todo sale de requirements.txt (E-19; rebase del frente F sobre de6964e,
  # 2026-09-17): jacobs/store.py depende de comportamiento de aiomysql revisado
  # a mano, y jacobs/_store_pool_test.py::VersionDeAiomysqlTest falla si la
  # instalada no es la revisada. Sin aiofiles (E-18 lo retiro).
  subpipeline-contrato-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: jax_memory_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JAX_DB_HOST: 127.0.0.1
      JAX_DB_PORT: "3306"
      JAX_DB_USER: root
      JAX_DB_PASSWORD: ci
      JAX_DB_NAME: jax_memory_test
      PYTHONPATH: .:las_manos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # 2026-09-17 (pre-vuelo y continuar): crear un pipeline ahora pasa por el
      # pre-vuelo, que lee `facet`, `model`, `capability` y `credential` -- tablas
      # que crean las migraciones de jax-platform, no init_tables() de Jacobs. Sin
      # este paso el job muere con "Table 'jax_memory_test.facet' doesn't exist",
      # que no es un fallo del codigo bajo prueba. Mismo patron que el job
      # jacobs-gobernanza-db.
      - name: Clonar jax-platform (sus migraciones crean la gobernanza)
        run: git clone --depth=1 https://github.com/fjruizhn/jax-platform.git /tmp/jax-platform
      - run: pip install -r /tmp/jax-platform/backend/requirements.txt
      - name: Esquema de gobernanza con SUS migraciones
        working-directory: /tmp/jax-platform/backend
        run: |
          python - <<'PY'
          import asyncio
          from db.connection import close_pool
          from db.migrations import run_migrations

          async def main():
              await run_migrations()
              await close_pool()

          asyncio.run(main())
          print("run_migrations OK")
          PY
      - run: python -m pytest -v jacobs/_subpipeline_contrato_io_test.py tests/test_subpipeline_contrato_rutas.py jacobs/_store_pool_test.py las_manos/_human_gate_io_test.py jacobs/_cupo_io_test.py jacobs/_pipeline_identity_test.py jacobs/_step_motor_test.py jacobs/_devolucion_persistencia_test.py
      - name: Piso exacto de tests CORRIDOS
        # Los dos archivos se saltan sin JAX_DB_HOST: un skip masivo se ve verde.
        run: |
          python -m pytest -q jacobs/_subpipeline_contrato_io_test.py \
            tests/test_subpipeline_contrato_rutas.py jacobs/_store_pool_test.py \
            las_manos/_human_gate_io_test.py jacobs/_cupo_io_test.py \
            jacobs/_pipeline_identity_test.py jacobs/_step_motor_test.py \
            jacobs/_devolucion_persistencia_test.py 2>&1 | tee /tmp/out
          # 31 el 2026-09-16 (frente F): 20 contra la base (esquema 5, emision 7,
          #   consumo 8 con la carrera de 20, la carrera forzada, el EXPLAIN y el paso
          #   de Ada terminado con padre running) + 11 por la ruta con el arnes que
          #   hace de Ada. Vistos en rojo contra master; carrera, EXPLAIN, orden del
          #   kill switch y enmienda del paso validados por mutacion.
          # 31 -> 34 el 2026-09-16 (revision final del frente F): +3 por la ruta --
          #   error tras consumir deja SUBPIPELINE_RECHAZADO fase=creacion y relanza el
          #   original (I-2), el hijo hereda la identidad del padre y un cuerpo con otra
          #   identidad es 403 sin quemar el token (I-3). Los tres vistos en rojo.
          # 34 -> 36 el 2026-09-17 (residual de I-2, R13): +2 por la ruta -- la
          #   relectura tras el UPDATE confirmado falla con un error REAL de la base
          #   y una cancelacion llega tras quemar el token (en el consumo y en la
          #   creacion); en los dos: SUBPIPELINE_RECHAZADO sin el token, hijo no
          #   creado, error relanzado. Vistos en rojo; mutacion de cada except a
          #   `except Exception` vuelve a romper el de la cancelacion.
          # 36 -> 61 el 2026-09-17 (pool de conexiones de Jacobs): +25 de
          #   jacobs/_store_pool_test.py -- 20 llamadas concurrentes no abren 20
          #   conexiones (rojo contra eb72e78: 20 de 20; en serie 30 de 30), sesion
          #   identica a la conexion directa, sin fugas en excepcion/cancelacion/
          #   autocommit apagado/transaccion abierta/desechable, espera y cierre

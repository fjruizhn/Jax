# Runtime rendezvous: only jaxsvc can replace/bind; jaxqwen may traverse and
# connect to a socket whose group is jaxqwen-proxy.
d /run/jaxqwen-proxy 0750 jaxsvc jaxqwen-proxy -
# Capability state and independent per-mission Git clones; no shared .git RW.
d /var/lib/jaxqwen 0700 jaxqwen jaxqwen -
d /var/lib/jaxqwen/state 0700 jaxqwen jaxqwen -
d /var/lib/jaxqwen/missions 0700 jaxqwen jaxqwen -
# Governed dispatcher writes worktrees as owner; jaxqwen can read them via the
# dedicated dispatch group. It has no shared Git metadata write permission.
d /var/lib/jaxqwen-dispatch 0750 jaxqwen-dispatcher jaxqwen-dispatch -
d /var/lib/jaxqwen-dispatch/repo 0750 jaxqwen-dispatcher jaxqwen-dispatch -
d /var/lib/jaxqwen-dispatch/worktrees 0750 jaxqwen-dispatcher jaxqwen-dispatch -

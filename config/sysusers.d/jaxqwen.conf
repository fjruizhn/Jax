# Dedicated LAS VOCES machine identity. It is not a member of jaxsvc or
# jax-carril; the shared group grants only access to the protected model UDS.
g jaxqwen - -
u jaxqwen - "LAS VOCES structured builder capability" /var/lib/jaxqwen /usr/sbin/nologin
g jaxqwen-proxy - -
g jaxqwen-dispatch - -
m jaxsvc jaxqwen-proxy
m jaxqwen jaxqwen-proxy
m jaxqwen jaxqwen-dispatch
u jaxqwen-dispatcher - "LAS VOCES governed handoff dispatcher" /nonexistent /usr/sbin/nologin
m jaxqwen-dispatcher jaxqwen-dispatch

# 2026-09-25 (auditoría escalón 3, MAJOR-1 de jax#274): el PYTHONPATH efectivo
# de este worker apuntaba a /home/fruiz/jax -- el checkout de TRABAJO de un
# agente, en rama ajena, no el de producción. Demostrado ANTES de fijar este
# valor: con PYTHONPATH=/srv/jax-prod/jax, el módulo de ExecStart importa sin
# error corriendo como jaxsvc con /srv/jax-prod/jax/.venv/bin/python (el mismo
# intérprete de ExecStart).
[Service]
Environment=PYTHONPATH=/srv/jax-prod/jax

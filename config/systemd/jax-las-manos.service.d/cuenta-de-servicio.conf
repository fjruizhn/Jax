[Service]
# Cuenta de servicio (2026-09-17, decisión de Fernando): los servicios no corren como el
# operador, así /etc/jax/.env deja de ser legible por un proceso cualquiera de fruiz.
# HOME propio: ssh (a la cuenta del Ejecutor) busca known_hosts en $HOME.
User=jaxsvc
Group=jaxsvc
SupplementaryGroups=jax-carril
Environment=HOME=/var/lib/jaxsvc

# Drop-in para jax-platform.service y jax-las-manos.service (ver LEEME.md).
# Antes de cada arranque espera a que la MariaDB de JAX acepte consultas.
# Si no responde en 9 min, el arranque falla (fallo cerrado) y avisa.
[Unit]
Wants=docker.service
After=docker.service
OnFailure=aviso-fallo@%n.service

[Service]
# «+»: corre como root; jaxsvc no tiene acceso al socket de docker.
ExecStartPre=+/usr/local/sbin/jax-db-esperar
TimeoutStartSec=600

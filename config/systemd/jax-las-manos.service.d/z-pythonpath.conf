# 2026-09-22: el checkout de producción trae procesamiento/ en la raíz del repo
# (jax#252) y las_manos/server.py lo importa. Sin la raíz en sys.path el arranque
# muere con ModuleNotFoundError. WorkingDirectory es las_manos/, así que la raíz
# tiene que venir por PYTHONPATH.
[Service]
Environment=PYTHONPATH=/srv/jax-prod/jax
